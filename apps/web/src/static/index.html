    ${field("Người quay", client, "client", "Anh Nam")}
    <div style="display:flex;align-items:center;gap:24px;padding:16px 0;border-bottom:1px solid var(--co-hairline);">
      <div style="width:140px;flex:0 0 140px;font-size:14px;color:var(--co-dim);">Thumbnail</div>
      ${thumb ? `
        <div style="width:96px;height:54px;border-radius:6px;background:center/cover no-repeat url(${esc(thumb)});flex:0 0 96px;"></div>
        <div style="flex:1"></div>
        <label class="co-act" style="font-size:13px;color:var(--co-accent-text);cursor:pointer;white-space:nowrap;"><input type="file" accept="image/*" style="display:none;" onchange="window.__readCreateProjectThumb&&window.__readCreateProjectThumb(this)" />Đổi ảnh</label>
        <div data-act="clearCreateProjectThumb" class="co-act" style="font-size:13px;color:var(--co-bad);cursor:pointer;white-space:nowrap;">Xoá</div>
      ` : `
        <label id="createProjectThumbDropzone" style="flex:1;min-width:0;font-size:14px;color:var(--co-faint);cursor:pointer;"
               ondragover="event.preventDefault();this.style.color='var(--co-accent)';"
               ondragleave="this.style.color='var(--co-faint)';"
               ondrop="event.preventDefault();this.style.color='var(--co-faint)';if(event.dataTransfer.files&&event.dataTransfer.files[0]){const i=this.querySelector('input');i.files=event.dataTransfer.files;window.__readCreateProjectThumb&&window.__readCreateProjectThumb(i);}">
          <input type="file" accept="image/*" style="display:none;" onchange="window.__readCreateProjectThumb&&window.__readCreateProjectThumb(this)" />
          Kéo ảnh vào đây hoặc bấm để chọn · .jpg / .png / .webp, tối đa 5 MB
        </label>
      `}
    </div>
    ${s.createProjectError ? `<div style="margin-top:18px;font-size:13px;color:var(--co-bad);line-height:1.55;">${esc(s.createProjectError)}</div>` : ""}
    <div style="display:flex;align-items:center;gap:20px;padding-top:22px;">
      <div style="flex:1"></div>
      ${mBtn("neutral", { act: "closeCreateProject", label: "Huỷ", sm: true })}
      ${mBtn("filled", { act: "submitCreateProject", label: s.createProjectBusy ? "Đang tạo…" : "Tạo dự án", sm: true, disabled: !canSubmit })}
    </div>`);
}

window.__syncCreateProjectForm = function () {
  const nameEl = document.getElementById("createProjectNameInput");
  const submitEl = document.querySelector('[data-act="submitCreateProject"]');
  if (submitEl) {
    const canSubmit = !!String(state.createProjectName || "").trim() && !state.createProjectBusy;
    submitEl.disabled = !canSubmit;
    submitEl.style.background = canSubmit ? "#9184d9" : "var(--co-panel-2)";
    submitEl.style.color = canSubmit ? "#07111a" : "var(--co-faint)";
    submitEl.style.cursor = canSubmit ? "pointer" : "not-allowed";
  }
  if (nameEl && document.activeElement !== nameEl && state.showCreateProject && !state.createProjectBusy) {
    // no-op guard: don't steal focus back while user edits another field
  }
};

window.__updateCreateProjectField = function (field, value) {
  if (field === "name") state.createProjectName = String(value || "");
  if (field === "client") state.createProjectClient = String(value || "");
  if (state.createProjectError) {
    state.createProjectError = "";
    render();
    return;
  }
  window.__syncCreateProjectForm && window.__syncCreateProjectForm();
};

window.__readCreateProjectThumb = function (input) {
  const file = input.files && input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    state.createProjectThumbDataUrl = String(ev.target.result || "");
    render();
  };
  reader.readAsDataURL(file);
};

function computeVals() {
  const s = state;
  const A = AUTHORS;
  const { cur, prog } = sceneAt(s.currentMs);

  const allSources = Object.values(s.sourcesByProject).flat();
  const selSrc = allSources.find((x) => x.id === s.selectedId) || allSources[0];
  // Empty-project placeholder: when the user is logged in but the workspace has
  // no projects yet (fresh install, all archived, etc.), render() needs a
  // non-null object to walk so downstream code doesn't crash with "undefined.id".
  const EMPTY_PROJECT = { id: "", name: "—", status: "progress", client: "", team: [], updated: "" };
  const selProject = PROJECTS.find((p) => p.id === s.selectedProjectId) || EMPTY_PROJECT;
  const projStatus = effStatus(selProject);

  const counts = { all: PROJECTS.length, progress: 0, done: 0, published: 0 };
  PROJECTS.forEach((p) => { counts[effStatus(p)]++; });
  const order = ["progress", "done", "published"];
  const mapProject = (p) => {
    const srcs = s.sourcesByProject[p.id] || [];
    const nReady = srcs.filter((x) => x.status === "ready").length;
    const nComments = srcs.reduce((a, x) => a + (x.comments || 0), 0);
    const est = effStatus(p);
    const sm = SM[est];
    const first = srcs[0] || { a: "#15171c", b: "#3a4453" };
    const firstPoster = srcs.find((x) => x.posterUrl)?.posterUrl || "";
    return {
      ...p, statusLabel: sm.label, statusColor: sm.color,
      created: p.createdAt ? new Date(p.createdAt).toLocaleDateString("vi-VN", { day: "2-digit", month: "short", year: "numeric" }) : (p.created || "—"),
      storage: p.storage || (srcs.length ? `${srcs.length} nguồn` : "—"),
      cover: p.thumbUrl || firstPoster || ("linear-gradient(150deg," + first.a + "," + first.b + ")"),
      coverIsImage: !!(p.thumbUrl || firstPoster),
      thumbs: srcs.slice(0, 4).map((x) => x.posterUrl || ("linear-gradient(160deg," + x.a + "," + x.b + ")")),
      nSources: srcs.length, nComments,
      pct: srcs.length ? Math.round((nReady / srcs.length) * 100) : 0,
      readyLabel: nReady + "/" + srcs.length + " nguồn có proxy",
      isProgress: est === "progress",
      team: p.team.map((t) => ({ initial: t[0], color: t[1] })),
    };
  };
  const visibleProjects = PROJECTS;
  const projectGroups = order.filter((k) => s.statusFilter === "all" || s.statusFilter === k).map((k) => ({
    key: k, label: SM[k].label, color: SM[k].color,
    showHeader: s.statusFilter === "all",
    count: counts[k],
    projects: visibleProjects.filter((p) => effStatus(p) === k).map(mapProject),
  })).filter((g) => g.projects.length > 0);
  const selectedProjectMembers = (window.__projectMembersByProject && window.__projectMembersByProject[s.selectedProjectId]) || [];
  const roleLabel = { owner: "Owner", editor: "Editor", reviewer: "Reviewer", client: "Client" };
  const projectMembers = selectedProjectMembers.map((member) => {
    const user = member.user || {};
    return {
      projectId: member.projectId,
      userId: member.userId,
      role: member.role,
      name: user.name || member.userId,
      initial: user.initial || (user.name || "?").charAt(0).toUpperCase(),
      color: user.color || "#9184d9",
      meta: user.email || "Thành viên project",
      badge: roleLabel[member.role] || member.role,
      badgeBg: member.role === "owner" ? "rgba(145,132,217,0.16)" : member.role === "client" ? "rgba(43,190,110,0.16)" : "var(--co-hover)",
      badgeColor: member.role === "owner" ? "#9184d9" : member.role === "client" ? "#2bbe6e" : "var(--co-text-2)",
      roleOptions: ["owner", "editor", "reviewer", "client"].map((value) => ({ value, label: roleLabel[value], selected: value === member.role })),
    };
  });
  const existingMemberIds = new Set(projectMembers.map((member) => member.userId));
  const memberInviteOptions = Object.values(remote.users || {})
    .filter((user) => !existingMemberIds.has(user.id))
    .map((user) => ({ value: user.id, label: user.name + (user.email ? " · " + user.email : ""), selected: user.id === s.inviteUserId }));
  const memberRoleOptions = ["reviewer", "editor", "client"].map((value) => ({ value, label: roleLabel[value], selected: value === s.inviteRole }));
  const inviteReady = !!s.inviteUserId;

  const projSources = s.sourcesByProject[s.selectedProjectId] || [];
  const sources = projSources.map((src, i) => {
    const st = SRC_STATUS[src.status];
    const resLabel = src.resolutionLabel || (src.height >= 2160 || src.width >= 3840 ? "4K" : src.height >= 1080 ? "Full HD" : src.height >= 720 ? "HD" : "");
    const metaParts = [src.codec];
    if (resLabel) metaParts.push(resLabel);
    metaParts.push(fmtDur(src.dur), src.size);
    return {
      id: src.id, pos: String(i + 1).padStart(2, "0"), title: src.title,
      bg: "linear-gradient(150deg," + src.a + "," + src.b + ")",
      thumbBg: src.posterUrl ? `center/cover no-repeat url(${src.posterUrl})` : ("linear-gradient(150deg," + src.a + "," + src.b + ")"),
      durLabel: fmtDur(src.dur),
      meta: metaParts.join(" · "),
      // Even while proxy is being transcoded, the original is playable via
      // /assets/:id/source — say so instead of the alarming "đang chờ worker".
      statusLabel: src.status === "processing" ? ((src.progress || 0) > 0 ? ("Proxy " + (src.progress || 0) + "% · bản gốc sẵn sàng") : "Đang tạo proxy · bản gốc sẵn sàng") : st.label,
      statusColor: st.color, statusBg: st.bg, comments: src.comments,
      dragOpacity: s.dragId === src.id ? 0.4 : 1,
      rowBorder: s.dragId === src.id ? "rgba(145,132,217,0.6)" : "var(--co-border)",
      transcoding: src.status === "processing",
      pct: src.progress || 0,
      nasPath: src.nasPath || src.path || src.title || "NAS",
      airDate: src.airDate || "",
      airLabel: src.airDate ? fmtAirDate(src.airDate) : "",
    };
  });
  const nProjReady = projSources.filter((x) => x.status === "ready").length;
  const nProjComments = projSources.reduce((a, x) => a + (x.comments || 0), 0);


  // "source" = play the original NAS file directly (no transcode). This is the
  // default playback URL — we surface it in the quality menu so the user can
  // see what is playing and explicitly pin to it when they want full quality
  // (e.g. 4K) instead of a proxy.
  const SOURCE_QUALITY = { id: "source", label: "Bản gốc", res: "Original", bitrate: "Full quality", sub: "Phát trực tiếp file NAS · không chờ proxy", status: "ready" };
  const qualityList = [SOURCE_QUALITY, ...s.qualities];
  const activeQ = qualityList.find((q) => q.id === s.quality) || qualityList[0];
  const selectedSrc = selSrc || selectedSource();
  const sourceResLabel = selectedSrc && selectedSrc.resolutionLabel
    ? selectedSrc.resolutionLabel
    : (selectedSrc && (selectedSrc.height >= 2160 || selectedSrc.width >= 3840) ? "4K" : selectedSrc && selectedSrc.height >= 1080 ? "Full HD" : selectedSrc && selectedSrc.height >= 720 ? "HD" : "Source");
  const sourceResText = selectedSrc && selectedSrc.width && selectedSrc.height
    ? (selectedSrc.width + "×" + selectedSrc.height)
    : "Nguồn gốc";
  const transcodeRuntime = remote.transcodeRuntime || null;
  const transcodeRuntimeMessage = normalizeTranscodeRuntimeMessage(transcodeRuntime);
  const transcodeRuntimeHelpTextValue = transcodeRuntimeHelpText(transcodeRuntime);
  const qualities = qualityList.map((q) => {
    const isActive = q.id === s.quality;
    let tag = "Sẵn sàng", tagColor = "#2bbe6e", tagBg = "rgba(43,190,110,0.14)";
    if (q.id === "source") { tag = "Bản gốc"; tagColor = "#ef4d57"; tagBg = "rgba(239,77,87,0.16)"; }
    else if (q.status === "processing") { tag = (q.progress || 0) > 0 ? ((q.progress || 0) + "%") : "Đang tạo proxy"; tagColor = "#d9a45b"; tagBg = "rgba(217,164,91,0.14)"; }
    else if (q.status === "pending") { tag = "Tạo proxy"; tagColor = "#9184d9"; tagBg = "rgba(145,132,217,0.14)"; }
    return { ...q, isActive, labelColor: isActive ? "#9184d9" : "var(--co-text)",
      rowBg: isActive ? "rgba(145,132,217,0.1)" : "transparent", tag, tagColor, tagBg };
  });
  const ladderSource = { badge: sourceResLabel || "SRC", label: "Source", res: sourceResText, detail: (selectedSrc ? selectedSrc.codec + " · " + selectedSrc.size : "Video source trên NAS"), status: "nas" };
  const ladder = [ladderSource, ...s.qualities].map((l) => {
    let tag, tagColor, tagBg, canRequest = false, isProcessing = false;
    let detail = l.detail || ("h.264 · " + l.bitrate + " · HLS 4s segment · " + l.sub);
    const lastError = String(l.lastError || "").trim();
    const workerUnavailable = !!(transcodeRuntime && transcodeRuntime.status !== "memory" && transcodeRuntime.canTranscode === false);
    if (l.status === "nas") { tag = "NAS only"; tagColor = "#8896ab"; tagBg = "var(--co-border)"; }
    else if (l.status === "ready") { tag = "Sẵn sàng"; tagColor = "#2bbe6e"; tagBg = "rgba(43,190,110,0.14)"; }
    else if (l.status === "processing") { tag = (l.progress || 0) > 0 ? ((l.progress || 0) + "%") : "Đang chờ"; tagColor = "#d9a45b"; tagBg = "rgba(217,164,91,0.14)"; isProcessing = true; }
    else if (l.status === "failed") {
      tag = /not mounted|mount root|khong thay|không thấy|khong du quyen|không đủ quyền/i.test(lastError) ? "Lỗi mount NAS" : "Transcode lỗi";
      tagColor = "#ef4d57";
      tagBg = "rgba(239,77,87,0.12)";
      canRequest = !workerUnavailable;
      if (lastError) detail = lastError;
    } else { tag = "Chưa tạo"; tagColor = "#8896ab"; tagBg = "var(--co-border)"; canRequest = true; }
    if (!l.status || l.status === "pending" || l.status === "failed") {
      if (workerUnavailable) {
        tag = "Worker chưa sẵn sàng";
        tagColor = "#ef4d57";
        tagBg = "rgba(239,77,87,0.12)";
        canRequest = false;
        if (transcodeRuntimeMessage) detail = transcodeRuntimeMessage;
      }
    }
    const isSrc = l.status === "nas";
    const pendingRequest = !!(state._proxyRequestPending && state._proxyRequestPending[l.id]);
    return { id: l.id, badge: l.badge || l.label.replace("p", ""), label: l.label, res: l.res,
      detail,
      tag, tagColor, tagBg, canRequest, isProcessing, progress: l.progress || 0,
      pendingRequest,
      iconBg: isSrc ? "rgba(239,77,87,0.14)" : "rgba(145,132,217,0.14)",
      iconColor: isSrc ? "#ef4d57" : "#9184d9",
      rowBg: isSrc ? "rgba(239,77,87,0.05)" : "var(--co-hover)",
      rowBorder: isSrc ? "rgba(239,77,87,0.18)" : "var(--co-border)" };
  });

  const mapComment = (c) => {
    const au = A[c.who] || A.me;
    return { id: c.id, color: au.color, initial: au.initial, name: au.name, authorKey: c.authorKey || c.who || c.id,
      roleTag: au.role, roleColor: au.role ? "#2bbe6e" : "transparent",
      content: c.content, ago: c.ago, resolved: c.resolved,
      annotation: c.annotation || null,
      hasAnnotation: !!(c.annotation && ((c.annotation.strokes && c.annotation.strokes.length) || (c.annotation.texts && c.annotation.texts.length))),
      annotationStrokeCount: c.annotation && c.annotation.strokes ? c.annotation.strokes.length : 0,
      annotationTextCount: c.annotation && c.annotation.texts ? c.annotation.texts.length : 0,
      annotationTcLabel: fmtTc(c.ms),
      tcLabel: fmtTc(c.ms), ms: c.ms, leftPct: (c.ms / s.duration) * 100,
      cardBg: c.resolved ? "rgba(255,255,255,0.015)" : "var(--co-panel)",
      cardBorder: c.resolved ? "var(--co-hover)" : "var(--co-border)",
      contentStyle: c.resolved ? "opacity:.5;text-decoration:line-through;text-decoration-color:rgba(255,255,255,0.25)" : "",
      resolveBg: c.resolved ? "#2bbe6e" : "transparent",
      resolveColor: c.resolved ? "#07090e" : "#5d6b82",
      resolveBorder: c.resolved ? "#2bbe6e" : "var(--co-border-2)",
      menuOpen: s.commentMenuId === c.id,
      isEditing: s.editingCommentId === c.id,
      editingText: s.editingCommentId === c.id ? s.editingCommentText : c.content,
      hasReplies: c.replies && c.replies.length > 0,
      replies: (c.replies || []).map((r) => ({
        id: r.id,
        name: (A[r.who] || A.me).name,

let lastNasListMeta = [];
const PERSIST_SCROLL_IDS = ["hubScroll", "projectDetailScroll", "importListScroll", "notesScroll", "settingsScroll", "scriptsScroll", "scriptScroll"];

function capturePersistedScrollPositions() {
  const out = {};
  for (const id of PERSIST_SCROLL_IDS) {
    const el = document.getElementById(id);
    if (!el) continue;
    out[id] = { top: el.scrollTop, left: el.scrollLeft };
  }
  return out;
}

function restorePersistedScrollPositions(saved) {
  if (!saved || typeof saved !== "object") return;
  for (const id of PERSIST_SCROLL_IDS) {
    const pos = saved[id];
    if (!pos) continue;
    const el = document.getElementById(id);
    if (!el) continue;
    el.scrollTop = Number(pos.top || 0);
    el.scrollLeft = Number(pos.left || 0);
  }
}

// render() replaces app.innerHTML wholesale, which destroys and recreates
// every DOM node — including whatever text field the user is mid-typing in.
// Without this, every render triggered while typing (and oninput handlers
// that call render()/scheduleRender() fire on EVERY keystroke) drops focus,
// forcing the user to click back into the field after each character. This
// generic capture/restore runs for every render across the whole app instead
// of requiring a bespoke `_focusX` flag per field.
function captureFocusedField() {
  const el = document.activeElement;
  if (!el || !el.id) return null;
  if (el.tagName !== "INPUT" && el.tagName !== "TEXTAREA" && el.tagName !== "SELECT") return null;
  const saved = { id: el.id };
  if (typeof el.selectionStart === "number") {
    saved.selectionStart = el.selectionStart;
    saved.selectionEnd = el.selectionEnd;
  }
  return saved;
}
function restoreFocusedField(saved) {
  if (!saved) return;
  const el = document.getElementById(saved.id);
  if (!el || document.activeElement === el) return;
  el.focus();
  if (typeof saved.selectionStart === "number" && typeof el.setSelectionRange === "function") {
    try { el.setSelectionRange(saved.selectionStart, saved.selectionEnd); } catch (_) {}
  }
}

function render() {
  // Clear any pending scheduled-render flag — a direct render() call already
  // does the work, so the rAF callback can be a noop when it fires.
  _renderQueued = false;
  const savedFocus = captureFocusedField();
  const savedScroll = capturePersistedScrollPositions();
  const vals = computeVals();
  lastNasListMeta = vals.nasList;
  const app = document.getElementById("app");
  // Preserve the live <video> across the innerHTML rebuild below. Without
  // this, EVERY render (presence event, comment event, menu toggle…) destroys
  // the element mid-playback: the video pauses, the entire media buffer is
  // thrown away, and nothing resumes it. Detached media elements keep their
  // playback + buffer state, so we lift it out and swap it back in.
  const liveVideo = document.getElementById("reviewVideo");
  // The script editor (TipTap) lives outside the rebuild: its host node is
  // moved back into #scriptEditorMount below, keeping selection and undo.
  const scriptEdFocused = !!(scriptEd && scriptEd.isFocused);

  document.documentElement.setAttribute("data-theme", state.theme);
  app.setAttribute("data-theme", state.theme);

  // Row layout: the design is a 52px wordmark rail plus one full-height screen.
  // There is no top bar and no docked sidebar any more — each screen owns its
  // own header, and everything transient (palette, overlays) floats above.
  const screen =
    state.view === "projects" ? projectsHub(vals)
    : state.view === "calendar" ? calendarView(vals)
    : state.view === "scripts" && remote.canUseScripts ? scriptsView()
    : state.view === "script" && remote.canUseScripts ? scriptEditorView()
    : state.view === "project" ? projectDetail(vals)
    : state.view === "review" ? review(vals)
    : state.view === "settings" ? settingsPage(vals)
    : projectsHub(vals);
  app.innerHTML = `
    <div style="display:flex;flex:1;min-height:0;">
      ${leftRail(vals)}
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;">
        ${screen}
      </div>
    </div>
    ${state.showMembers ? membersModal(vals) : ""}
    ${state.showAudit ? auditModal(vals) : ""}
    ${state.showTranscode ? transcodeModal(vals) : ""}
    ${state.showImport ? importModal(vals) : ""}
    ${state.showUpdateModal ? updateModal(vals) : ""}
    ${state.showCreateProject ? createProjectModal() : ""}
    ${state.paletteOpen ? commandPalette(vals) : ""}
    ${state.datePickerFor ? datePickerPopover() : ""}
    ${projectContextMenu()}
    ${sourceContextMenu()}
  `;
  // Swap the preserved video back in place of the freshly created one, as
  // long as it still plays the same source (hls.js strips the src attribute
  // and stamps data-hls instead, so compare whichever is set).
  const freshVideo = document.getElementById("reviewVideo");
  if (liveVideo && freshVideo !== liveVideo) {
    const liveSrc = liveVideo.dataset.hls || liveVideo.getAttribute("src") || "";
    if (freshVideo && liveSrc && liveSrc === (freshVideo.getAttribute("src") || "")) {
      freshVideo.replaceWith(liveVideo);
    } else {
      // Dropped element (source switched or review closed): stop it —
      // a detached media element otherwise keeps playing audio.
      try { liveVideo.pause(); } catch (_) {}
    }

  else if (scriptEd) destroyScriptEditor(); // left the editor: flush + tear down

// ---- event delegation ----
// Walks up from the clicked element looking for the nearest data-act handler.
// data-stop terminates the walk — used by modal inner panels so a click inside
// the panel doesn't bubble up to the backdrop's data-act="close…" and dismiss
// the modal. Before this guard, clicking any input/button inside the create-
// project, members, or update modal closed the whole thing.
// Material ripple — one state-layer circle per press, cleaned up on animation
// end (and harmlessly on the next render() innerHTML swap either way).
document.addEventListener("pointerdown", (e) => {
  const btn = e.target && e.target.closest && e.target.closest(".m-btn");
  if (!btn || btn.disabled) return;
  const r = btn.getBoundingClientRect();
  const d = Math.max(r.width, r.height);
  const span = document.createElement("span");
  span.className = "m-ripple";
  span.style.width = span.style.height = d + "px";
  span.style.left = (e.clientX - r.left - d / 2) + "px";
  span.style.top = (e.clientY - r.top - d / 2) + "px";
  btn.appendChild(span);
  span.addEventListener("animationend", () => span.remove());
});

document.addEventListener("click", (e) => {
  const within = (sel) => !!(e.target && e.target.closest && e.target.closest(sel));
  if (state.scriptMenu && !within("[data-script-menu]")) { state.scriptMenu = null; paintScriptChrome(); }
  if (state.scriptProjMenu && !within("[data-script-proj]")) { state.scriptProjMenu = false; state.scriptProjQuery = ""; render(); }
  const inContextMenu = e.target && e.target.closest && e.target.closest("[data-context-menu]");
  if (!inContextMenu && (state.projectContextMenu || state.sourceContextMenu)) {
    state.projectContextMenu = null;
    state.sourceContextMenu = null;
    render();
  }
  let n = e.target;
  while (n && n !== document) {
    if (n.dataset && n.dataset.act) {
      const act = n.dataset.act;
      const arg = n.dataset.arg;
      e.stopPropagation();
      handleAct(act, arg, e, n);
      return;
    }
    if (n.dataset && n.dataset.stop) return;
    n = n.parentNode;
  }
});

document.addEventListener("contextmenu", (e) => {
  const projectNode = e.target && e.target.closest && e.target.closest("[data-project-menu-id]");
  if (projectNode) {
    e.preventDefault();
    e.stopPropagation();
    openProjectContextMenu(projectNode.dataset.projectMenuId, e.clientX, e.clientY);
    return;
  }
  const sourceNode = e.target && e.target.closest && e.target.closest("[data-source-menu-id]");
  if (sourceNode) {
    e.preventDefault();
    e.stopPropagation();

});

document.addEventListener("keydown", (e) => {
  // ⌘K / Ctrl+K opens the palette from anywhere; Escape closes whatever
  // transient surface is on top, outermost-last.
  if ((e.metaKey || e.ctrlKey) && (e.key === "k" || e.key === "K")) {
    e.preventDefault();
    // Inside the script editor ⌘K means "insert link", like Docs.
    if (state.view === "script" && scriptEd && scriptEd.isFocused) return scriptToggleMenu("link");
    return handleAct(state.paletteOpen ? "closePalette" : "openPalette");
  }
  if (e.key === "Escape") {
    // Peel one layer per press, most transient first. The last rung leaves
    // review entirely — Escape on a full-bleed player should mean "get me out".
    if (state.projectContextMenu || state.sourceContextMenu) return setState({ projectContextMenu: null, sourceContextMenu: null });
    if (state.scriptMenu) { state.scriptMenu = null; paintScriptChrome(); if (scriptEd) scriptEd.commands.focus(); return; }
    if (state.scriptProjMenu) return setStateNow({ scriptProjMenu: false, scriptProjQuery: "" });
    if (state.scriptNewComment) return setStateNow({ scriptNewComment: null, scriptNewCommentText: "" });
    if (state.scriptEditComment) return setStateNow({ scriptEditComment: null, scriptEditCommentText: "" });
    if (state.datePickerFor) return setState({ datePickerFor: null });
    if (state.paletteOpen) return setState({ paletteOpen: false, paletteQuery: "" });
    if (state.showImport) return closeImport();
    if (state.showMembers) return setState({ showMembers: false });
    if (state.showAudit) return setState({ showAudit: false });
    if (state.showTranscode) return setState({ showTranscode: false });
    if (state.showUpdateModal) return setState({ showUpdateModal: false });
    if (state.showCreateProject) return closeCreateProjectModal();
    if (state.showQualityMenu || state.showVersionMenu) return setState({ showQualityMenu: false, showVersionMenu: false });
    if (state.annotationEditId) { annCommitTextEdit(); return; }
    if (state.editingCommentId) return cancelEditComment();
    if (state.replyingTo) return setState({ replyingTo: null, replyingToTcLabel: "" });
    if (state.drawOpen) return setState({ drawOpen: false });
    // Someone mid-sentence in the composer wants out of the field, not out of
    // the asset — give up focus and stop there.
    const t = e.target;
    if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) { t.blur(); return; }
    // In native fullscreen the browser's own Escape exits it; don't also navigate.
    if (document.fullscreenElement) return;
    if (state.view === "review") { e.preventDefault(); return handleAct("goProject"); }
  }
  if (e.target && e.target.id === "paletteInput" && e.key === "Enter") {
    e.preventDefault();
    const first = paletteResults((state.paletteQuery || "").trim().toLowerCase())[0];
    if (first) { setState({ paletteOpen: false, paletteQuery: "" }); handleAct(first.act, first.arg); }
    return;
  }
  // Comment composer: Enter sends, Shift+Enter inserts a newline. Cmd/Ctrl+Enter
  // still sends for users used to that shortcut. IME composition is respected so
  // Vietnamese typing doesn't fire mid-character.
  if (e.target && e.target.id === "commentInput" && e.key === "Enter" && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    postComment();
    return;
  }
  if (e.target && e.key === "Enter" && !e.shiftKey && !e.isComposing) {
    const id = e.target.id;
    if (id === "scriptNewCommentInput") { e.preventDefault(); return submitScriptComment(); }
    if (id === "scriptReplyInput") { e.preventDefault(); return replyScriptComment(state.scriptActiveThread); }
    if (id === "scriptEditCommentInput") { e.preventDefault(); return saveScriptCommentEdit(); }
    if (id === "scriptLinkInput") { e.preventDefault(); return scriptCmd("link-apply"); }
    if (id === "scriptProjSearch") {
      e.preventDefault();
      const first = document.querySelector('.sp-pop [data-act="pickScriptProject"][data-arg]:not([data-arg=""])');
      if (first) pickScriptProject(first.dataset.arg);
      return;
    }
  }
  if (state.view === "script" && (e.metaKey || e.ctrlKey) && e.altKey && (e.code === "KeyM")) { e.preventDefault(); return startScriptComment(); }
  if (state.view === "script" && (e.metaKey || e.ctrlKey) && (e.key === "s" || e.key === "S")) {
    e.preventDefault();
    if (state.scriptSave !== "conflict") saveScript();
    return;
  }
  // Enter in the title jumps into the body instead of doing nothing.
  if (e.target && e.target.id === "scriptTitle" && e.key === "Enter" && !e.isComposing) {
    e.preventDefault();
    if (scriptEd) scriptEd.commands.focus("start");
    return;
  }
  if (state.view !== "review" || state.paletteOpen) return;
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
  if ((e.metaKey || e.ctrlKey) && (e.key === "z" || e.key === "Z")) {
    e.preventDefault();
    return e.shiftKey ? annRedo() : annUndo();
  }
  if ((e.key === "Backspace" || e.key === "Delete") && state.annotationSelId) {
    e.preventDefault();
    annPushUndo();
    annRemoveObject(state.annotationSelId);
    state.annotationSelId = null;
    return render();
  }
  const annTool = ANN_TOOLS.find((x) => x.key === String(e.key).toUpperCase());
  if (annTool && !e.metaKey && !e.ctrlKey && !e.altKey) {
    e.preventDefault();
    return setState({ annotationTool: annTool.id, annotationSelId: annTool.id === "select" ? state.annotationSelId : null });
  }
  if (e.code === "Space") { e.preventDefault(); togglePlay(); }
  else if (e.key === "ArrowRight" || e.key === ".") { e.preventDefault(); frameFwd(); }
  else if (e.key === "ArrowLeft" || e.key === ",") { e.preventDefault(); frameBack(); }
  else if (e.key === "k" || e.key === "K") { pause(); render(); }
  else if (e.key === "l" || e.key === "L") { seekBy(2000); }
  else if (e.key === "j" || e.key === "J") { seekBy(-2000); }
});

const API_BASE = (function () {
  const m = document.querySelector('meta[name="api-base"]');
  if (m && m.content) return m.content.replace(/\/+$/, "");
  // dev default: API on 4000, FE on 3000
  if (location.port === "3000") return location.protocol + "//" + location.hostname + ":4000";
  return "/api";
})();

function apiMediaUrl(path) {
  return API_BASE + path;
}

// Decide the <video src=…> URL: "source" (default) → raw NAS file, otherwise
// look for an HLS master from the picked rendition. Falls back to source if
// the chosen proxy isn't ready yet (so the player never goes blank).
function pickPlaybackUrl(src, quality) {
  if (!src || !src.playbackUrl) return "";
  if (!quality || quality === "source") return src.playbackUrl;
  const versionId = state._currentVersionId;
  const rends = (versionId && REMOTE_RENDITIONS && REMOTE_RENDITIONS[versionId]) || [];
  const targetH = quality === "720p" ? 720 : quality === "1080p" ? 1080 : 0;
  const r = rends.find((x) => x.height === targetH);
  if (r && r.status === "ready" && r.hlsMasterUrl) {
    // hlsMasterUrl is "/hls/<rid>/master.m3u8" — proxied through the API.
    return apiMediaUrl(r.hlsMasterUrl);
  }
  return src.playbackUrl;
}

async function api(path, opts) {
  const res = await fetchWithTimeout(API_BASE + path, opts);
  const text = await res.text();
  let json = {};
  if (text) { try { json = JSON.parse(text); } catch (_) { json = { error: text.slice(0, 200) }; } }
  if (res.status === 401) {
    // Probing /me as part of bootstrap is expected to return 401 when not logged in —
    // surface a generic flag, not a noisy message. Login endpoints get the real DSM error.
    const isLoginPath = path.indexOf("/auth/") === 0;
    remote.me = null;
    throw Object.assign(new Error(isLoginPath ? (json.error || "Sai tài khoản hoặc mật khẩu") : "unauthorized"), { status: 401, body: json });
  }
  if (!res.ok) throw Object.assign(new Error(json.error || ("HTTP " + res.status)), { status: res.status, body: json });
  return json;
}

async function apiPublic(path, opts) {
  const res = await fetchWithTimeout(API_BASE + path, opts);
  const text = await res.text();
  const json = text ? JSON.parse(text) : {};
  if (!res.ok) throw Object.assign(new Error(json.error || ("HTTP " + res.status)), { status: res.status, body: json });
  return json;
}

async function fetchWithTimeout(url, opts) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), API_FETCH_TIMEOUT_MS);
  try {
    return await fetch(url, {
      credentials: "include",
      headers: { "content-type": "application/json", ...(opts && opts.headers) },
      method: (opts && opts.method) || "GET",
      body: opts && opts.body ? JSON.stringify(opts.body) : undefined,
      signal: controller.signal,
    });
  } catch (err) {
    if (err && err.name === "AbortError") throw new Error("Yeu cau qua lau, vui long thu lai");
    throw err;
  } finally {
    clearTimeout(timer);
  }
}

// ---- live version watchdog -------------------------------------------------
// Tab kept open across deploys is the #1 cache pain: the browser respects our
// no-store headers for index.html, but the *already-loaded* JS keeps running
// indefinitely. So on every deploy we want the live tab to detect "running
// SHA != server SHA" and reload itself with a cache-busting query string.
//
// Two anchors:
//   - window.__BUILD_SHA: stamped by dev-server.js at request time. This is
//     what the *currently running* JS was served with.
//   - /api/version .sha: the API container's BUILD_SHA, refreshed each pull.
// If the two diverge we reload.
const BOOT_SHA = (window.__BUILD_SHA || "unknown");
let _versionPollTimer = null;
let _reloadingForUpdate = false;
async function checkServerVersion() {
  if (_reloadingForUpdate) return;
  try {
    const meta = await apiPublic("/version");
    const remoteSha = meta && meta.sha ? String(meta.sha) : "";
    // Ignore the "unknown" sentinel — happens locally / on first build before
    // CI args land. Only act when both sides report a real hash and they
    // disagree.
    if (!remoteSha || remoteSha === "unknown" || BOOT_SHA === "unknown") return;
    if (remoteSha.slice(0, 12) === BOOT_SHA.slice(0, 12)) return;
    _reloadingForUpdate = true;
    showUpdateReloadBanner(remoteSha);
    // Give the user 4s to see the banner, then hard-reload with a cache-bust
    // query string so even an aggressive intermediary doesn't replay the old
    // HTML. Using location.replace + ?v=… is the most reliable cross-browser
    // way to bypass bfcache + disk cache.
    setTimeout(() => {
      try { localStorage.removeItem("co-stale"); } catch (_) {}
      const u = new URL(window.location.href);
      u.searchParams.set("v", remoteSha.slice(0, 12));
      window.location.replace(u.toString());
    }, 4000);
  } catch (_) { /* ignore — try again next tick */ }
}
function showUpdateReloadBanner(remoteSha) {
  if (document.getElementById("coopUpdateBanner")) return;
  const el = document.createElement("div");
  el.id = "coopUpdateBanner";
  el.style.cssText = "position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:9999;background:var(--co-glass);backdrop-filter:blur(14px);color:var(--co-text);font-size:13px;padding:12px 17px;border-radius:12px;box-shadow:var(--co-shadow);display:flex;align-items:center;gap:14px;animation:coFade 180ms ease;";
  el.innerHTML = '<span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--co-accent);"></span>Có bản cập nhật mới — đang tải lại trong giây lát…';
  document.body.appendChild(el);
}
function startVersionWatchdog() {
  if (_versionPollTimer) return;
  // First check on next tick (so /me resolves first), then every 60s. Also
  // re-check whenever the tab becomes visible again — common case: user
  // leaves a tab open overnight, NAS auto-updates, user comes back.
  setTimeout(checkServerVersion, 1500);
  _versionPollTimer = setInterval(checkServerVersion, 60_000);
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") {
      checkServerVersion();
      scheduleProxyStorageRefresh(120, true);
    }
  });
}

let proxyStoragePollTimer = null;
function startProxyStoragePolling() {
  if (proxyStoragePollTimer) return;
  proxyStoragePollTimer = setInterval(() => {
    if (!remote.me) return;
    const task = canManageProxyStorage()
      ? refreshProxyStorage(true, true)
      : refreshProxyStorageSummary(true, true);
    task.catch(() => {});
  }, 120_000);
  window.addEventListener("focus", () => {
    if (!remote.me) return;
    scheduleProxyStorageRefresh(120, true);
  });
}

async function bootstrap() {
  startVersionWatchdog();
  startProxyStoragePolling();
  // Update the boot loading hint so user sees progress instead of staring at a static spinner.
  const setHint = (msg) => { const el = document.getElementById("bootHint"); if (el) el.textContent = msg; };
  setHint("Kiểm tra cấu hình máy chủ…");
  try {
    const status = await apiPublic("/setup/status");
    remote.setup = status || { configured: true };
    remote.connected = true; // setup/status succeeded → API reachable
    if (status && status.configured === false) {
      if (status.publicUrl) setup.publicUrl = status.publicUrl;
      if (status.dsmHost) setup.dsmHost = status.dsmHost;
      if (status.dsmMountRoot) setup.dsmMountRoot = status.dsmMountRoot;
      if (status.dsmLibraryRoot) setup.dsmLibraryRoot = status.dsmLibraryRoot;
      if (status.updater && status.updater.feedUrl) setup.updateFeedUrl = status.updater.feedUrl;
      if (status.updater && status.updater.pollIntervalSeconds) setup.updatePollIntervalSeconds = status.updater.pollIntervalSeconds;
      render();
      return;
    }
  } catch (err) {
    remote.error = err.message;
    remote.connected = false;
  }
  // 1. Probe /me. If reachable + authed → load from API. If 401 → show login. If unreachable → connection-error overlay.
  setHint("Xác thực phiên…");
  try {
    const r = await api("/me");
    remote.connected = true; remote.me = r.user; remote.canUseScripts = !!r.canUseScripts;
    setHint("Tải dữ liệu…");
    await loadRemote();
    applyHashRoute();
  } catch (err) {
    if (err.status === 401) { remote.connected = true; remote.me = null; }
    else { remote.connected = false; remote.error = err.message; }
  }
  render();
  // Auto-retry connection in background when offline so user doesn't have to refresh manually
  // after a transient outage or while api/postgres are still warming up post-deploy.
  if (!remote.connected) scheduleBootRetry();
}

let _bootRetryTimer = null;
async function tryBootProbe() {
  try {
    const status = await apiPublic("/setup/status");
    remote.setup = status || { configured: true };
    remote.connected = true; remote.error = null;
    if (status && status.configured === false) {
      if (status.publicUrl) setup.publicUrl = status.publicUrl;
      if (status.dsmHost) setup.dsmHost = status.dsmHost;
      if (status.dsmMountRoot) setup.dsmMountRoot = status.dsmMountRoot;
      if (status.dsmLibraryRoot) setup.dsmLibraryRoot = status.dsmLibraryRoot;
      if (status.updater && status.updater.feedUrl) setup.updateFeedUrl = status.updater.feedUrl;
      if (status.updater && status.updater.pollIntervalSeconds) setup.updatePollIntervalSeconds = status.updater.pollIntervalSeconds;
      render();
      return;
    }
    try {
      const r = await api("/me");
      remote.me = r.user; remote.canUseScripts = !!r.canUseScripts;
      await loadRemote();
      applyHashRoute();
    } catch (e) {
      if (e.status === 401) { remote.me = null; }
      else { remote.connected = false; remote.error = e.message; }
    }
    render();
    if (!remote.connected) scheduleBootRetry();
  } catch (e) {
    remote.error = e.message;
    remote.connected = false;
    render();
    scheduleBootRetry();
  }
}
function scheduleBootRetry() {
  if (_bootRetryTimer) return;
  _bootRetryTimer = setTimeout(() => { _bootRetryTimer = null; tryBootProbe(); }, 5000);
}

async function loadRemote() {
  try {
    const [projects, users] = await Promise.all([api("/projects"), api("/users")]);
    remote.users = {}; users.forEach((u) => { remote.users[u.id] = u; });
    REMOTE_PROJECTS = projects;
    const hasSelected = projects.some((project) => project.id === state.selectedProjectId);
    if (!hasSelected) {
      state.selectedProjectId = projects[0] ? projects[0].id : "";
      state.selectedId = "";
      state.view = projects[0] ? state.view : "projects";
    }
    if (state.selectedProjectId) {
      await refreshProjectSources(state.selectedProjectId);
      await refreshProjectMembers(state.selectedProjectId);
    }
    openEventStream();
    startPresence();
    try { remote.presence = await api("/presence"); } catch (_) {}
    if (projects.some((project) => project.myRole === "owner")) {
      fetchUpdateStatus(false).catch(() => {});
      refreshProxyStorageSummary(true).catch(() => {});
      refreshProxyStorage(true).catch(() => {});
    } else {
      refreshProxyStorageSummary(true).catch(() => {});
    }
    refreshTranscodeRuntime().catch(() => {});
    if (window.location.hash) applyHashRoute();
  } catch (e) { remote.error = e.message; }
}

async function deleteProxyRendition(renditionId) {
  if (!renditionId) return;
  if (!window.confirm("Xoá proxy của rendition này khỏi MinIO? File bản gốc trên NAS không bị động.\n\nWorker sẽ tạo lại khi user chọn chất lượng này.")) return;
  state.proxyDeletingId = renditionId;
  render();
  try {
    await api("/renditions/" + encodeURIComponent(renditionId) + "/proxy", { method: "DELETE" });
    // Remove from local view immediately (optimistic), then refresh from server
    if (state.proxyStorage && Array.isArray(state.proxyStorage.renditions)) {
      const before = state.proxyStorage.renditions.find((r) => r.renditionId === renditionId);
      state.proxyStorage.renditions = state.proxyStorage.renditions.filter((r) => r.renditionId !== renditionId);
      if (before) {
        state.proxyStorage.totalBytes = Math.max(0, (state.proxyStorage.totalBytes || 0) - (before.bytes || 0));
        state.proxyStorage.renditionCount = Math.max(0, Number(state.proxyStorage.renditionCount || state.proxyStorage.renditions.length || 0) - 1);
      }
    }
    updateProxyCache(computeProxyCacheSummary(state.proxyStorage));
  } catch (err) {
    state.proxyStorageError = "Xoá thất bại: " + ((err && err.message) || "lỗi không xác định");
  } finally {
    state.proxyDeletingId = "";
    scheduleProxyStorageRefresh(250);
    render();
  }
}

// Realtime transport: try WebSocket first; fall back to SSE (EventSource).
// WS gives bidirectional channel (presence heartbeat goes over the same socket → fewer requests).
let eventSource = null;
let eventWs = null;
let wsHeartbeatTimer = null;

function normalizeUpdateStatusPayload(payload) {
  const body = payload && typeof payload === "object" ? payload : {};
  const local = body.local || {
    version: body.version || "không rõ",
    summary: body.summary || (body.localSha || body.sha ? "Bản API này chưa xuất release metadata đầy đủ." : "Chưa đọc được metadata bản đang chạy."),
    changes: Array.isArray(body.changes) ? body.changes : [],
    sha: body.localSha || body.sha || "unknown",
    builtAt: body.localBuiltAt || body.builtAt || "unknown",
    publishedAt: body.publishedAt || null,
  };
  const remote = body.remote || ((body.remoteSha || body.remoteVersion || body.remoteSummary) ? {
    version: body.remoteVersion || "không rõ",
    summary: body.remoteSummary || "Đã phát hiện metadata bản mới từ update feed.",
    changes: Array.isArray(body.remoteChanges) ? body.remoteChanges : [],
    publishedAt: body.remotePublishedAt || null,
    builtAt: body.remoteBuiltAt || null,
    sha: body.remoteSha || "unknown",
  } : null);
  const updateAvailable = typeof body.updateAvailable === "boolean"
    ? body.updateAvailable
    : !!(remote && local && remote.sha && local.sha && remote.sha !== "unknown" && local.sha !== "unknown" && remote.sha.slice(0, 7) !== local.sha.slice(0, 7));
  return {
    ...body,
    local,
    remote,
    updateAvailable,
    checkAvailable: typeof body.checkAvailable === "boolean" ? body.checkAvailable : !!(body.remoteSha || remote),
    triggerAvailable: typeof body.triggerAvailable === "boolean" ? body.triggerAvailable : false,
    pollIntervalSeconds: body.pollIntervalSeconds || (remote && remote.pollIntervalSeconds) || setup.updatePollIntervalSeconds || 900,
  };
}

function normalizeNasErrorMessage(message) {
  const text = String(message || "").trim();
  if (!text) return "Không đọc được NAS";
  if (/FileStation list_share failed/i.test(text)) {
    return "Không đọc được danh sách Shared Folder từ DSM. App sẽ thử fallback qua thư mục NAS đã mount; nếu vẫn lỗi, kiểm tra lại DSM mount root.";
  }
  if (/Khong tim thay thu muc NAS da mount/i.test(text) || /Không tìm thấy thư mục NAS đã mount/i.test(text)) return text;
  if (/DSM request timed out/i.test(text)) return "DSM phản hồi quá chậm. Kiểm tra kết nối Tailscale/DNS tới NAS rồi thử lại.";
  return text;
}

function normalizeTranscodeRuntimeMessage(status) {
  if (!status) return "";

}

function transcodeRuntimeHelpText(status) {

  if (status.spkRuntime) {
    if (status.status === "sim") {
      return "SPK đang thấy worker nhưng chưa có FFmpeg thật để encode. Cài Synology Codec Pack hoặc bundle FFmpeg, rồi restart package Coopeditor.";
    }

}

function openEventStream() {
  if (eventWs || eventSource) return;
  const wsBase = API_BASE.startsWith("http")
    ? API_BASE.replace(/^http/, "ws")
    : location.origin.replace(/^http/, "ws") + API_BASE;
  const wsUrl = wsBase.replace(/\/+$/, "") + "/ws";
  try {
    eventWs = new WebSocket(wsUrl);
    let wsOpened = false;
    eventWs.onopen = () => {
      wsOpened = true;
      // Replace HTTP presence heartbeat with WS messages (cheaper).
      wsHeartbeatTimer = setInterval(() => {
        try { eventWs.send(JSON.stringify({ type: "presence", focus: currentFocus() })); } catch (_) {}
      }, 25_000);
    };
    eventWs.onmessage = (ev) => { try { handleRemoteEvent(JSON.parse(ev.data)); } catch (_) {} };
    eventWs.onerror = () => { /* close handler will fall back */ };
    eventWs.onclose = () => {
      if (wsHeartbeatTimer) { clearInterval(wsHeartbeatTimer); wsHeartbeatTimer = null; }
      eventWs = null;
      if (!wsOpened) openSseStream(); // upgrade never succeeded → SSE fallback
    };
  } catch (_) {
    openSseStream();
  }
}
function openSseStream() {
  if (eventSource) return;
  try {
    eventSource = new EventSource(API_BASE + "/events", { withCredentials: true });
    eventSource.onmessage = (ev) => { try { handleRemoteEvent(JSON.parse(ev.data)); } catch (_) {} };
    eventSource.onerror = () => { /* browser auto-retries */ };
  } catch (_) {}
}
function closeEventStream() {
  if (eventWs) { try { eventWs.close(); } catch (_) {} eventWs = null; }
  if (wsHeartbeatTimer) { clearInterval(wsHeartbeatTimer); wsHeartbeatTimer = null; }
  if (eventSource) { eventSource.close(); eventSource = null; }
}

async function applySetup() {
  if (setup.busy || setup.restarting) return;
  const payload = {
    publicUrl: readValue("setupPublicUrl"),
    dsmHost: readValue("setupDsmHost"),
    dsmMountRoot: readValue("setupDsmMountRoot"),
    dsmLibraryRoot: readValue("setupDsmLibraryRoot") || "/",
    dsmDevLogin: readChecked("setupDsmDevLogin"),
    dsmInsecure: readChecked("setupDsmInsecure"),
    smtp: {
      url: readValue("setupSmtpUrl"),
      from: readValue("setupSmtpFrom"),
    },
    webhooks: {
      slackWebhookUrl: readValue("setupSlackWebhookUrl"),
      discordWebhookUrl: readValue("setupDiscordWebhookUrl"),
    },
    transcode: {
      workerConcurrency: readNumber("setupWorkerConcurrency", 2),
      codecLadder: readValue("setupCodecLadder") || "h264",
      hwaccel: readValue("setupHwaccel"),
      autoscaleThreshold: readNumber("setupAutoscaleThreshold", 5),
      autoscaleStep: readNumber("setupAutoscaleStep", 1),
      maxConcurrency: readNumber("setupMaxConcurrency", 3),
    },
    updater: {
      feedUrl: readValue("setupUpdateFeedUrl"),
      pollIntervalSeconds: readNumber("setupUpdatePollIntervalSeconds", 900),
    },
  };
  Object.assign(setup, {
    publicUrl: payload.publicUrl,
    dsmHost: payload.dsmHost,
    dsmMountRoot: payload.dsmMountRoot,
    dsmLibraryRoot: payload.dsmLibraryRoot,
    dsmDevLogin: payload.dsmDevLogin,
    dsmInsecure: payload.dsmInsecure,
    workerConcurrency: payload.transcode.workerConcurrency,
    codecLadder: payload.transcode.codecLadder,
    hwaccel: payload.transcode.hwaccel,
    autoscaleThreshold: payload.transcode.autoscaleThreshold,
    autoscaleStep: payload.transcode.autoscaleStep,
    maxConcurrency: payload.transcode.maxConcurrency,
    smtpUrl: payload.smtp.url,
    smtpFrom: payload.smtp.from,
    slackWebhookUrl: payload.webhooks.slackWebhookUrl,
    discordWebhookUrl: payload.webhooks.discordWebhookUrl,
    updateFeedUrl: payload.updater.feedUrl,
    updatePollIntervalSeconds: payload.updater.pollIntervalSeconds,
  });
  setup.error = "";
  setup.busy = true;
  render();
  try {
    await apiPublic("/setup/apply", { method: "POST", body: payload });
    setup.busy = false;
    setup.restarting = true;
    render();
    pollSetupReady();
  } catch (err) {
    setup.busy = false;
    setup.error = err.message || "Không lưu được cấu hình";
    render();
  }
}

async function pollSetupReady() {
  for (let i = 0; i < 60; i++) {
    await new Promise((resolve) => setTimeout(resolve, 2000));
    try {
      const status = await apiPublic("/setup/status");
      if (status && status.configured) {
        remote.setup = status;
        setup.restarting = false;
        return bootstrap();
      }
    } catch (_) {}
  }
  setup.error = "Đã lưu nhưng API chưa trở lại sau 2 phút. Kiểm tra log container API.";
  setup.restarting = false;
  render();
}

function readValue(id) {
  const el = document.getElementById(id);
  return el ? String(el.value || "").trim() : "";
}

function readChecked(id) {
  const el = document.getElementById(id);
  return !!(el && el.checked);
}

function readNumber(id, fallback) {
  const val = Number.parseInt(readValue(id), 10);
  return Number.isFinite(val) ? val : fallback;
}

async function handleRemoteEvent(ev) {
  // Worker progress emits a "rendition" event ~every few seconds while
  // transcoding — with 3 rungs × multiple assets in parallel, a burst can
  // hit dozens of events in one second. Use scheduleRender so they coalesce
  // into one DOM rebuild per frame instead of one per event.
  if (!ev || !ev.type) return;
  if (ev.type === "presence") { remote.presence = ev.users || []; scheduleRender(); return; }
  if (ev.type === "rendition") {
    if (state._currentVersionId && ev.assetVersionId === state._currentVersionId) {
      const id = ev.id.split("_").slice(-1)[0]; // "p1s1_v3_720p" -> "720p"
      state.qualities = state.qualities.map((q) => q.id === id ? { ...q, status: ev.status, progress: ev.progress } : q);
      if (ev.status === "failed" || ev.status === "ready") {
        refreshRenditions(state._currentVersionId).catch(() => {});
      }
    }
    if (ev.projectId && REMOTE_SOURCES[ev.projectId]) scheduleProjectSourcesRefresh(ev.projectId, ev.status === "ready" || ev.status === "failed" ? 120 : 400);
    if (ev.status === "failed") refreshTranscodeRuntime().catch(() => {});
    scheduleProxyStorageRefresh(
      ev.status === "ready" || ev.status === "failed" ? 300 : 1500,
      ev.status === "ready" || ev.status === "failed",
    );
    scheduleRender();
  } else if (ev.type === "asset") {
    if (REMOTE_SOURCES[ev.projectId]) scheduleProjectSourcesRefresh(ev.projectId, 120);
  } else if (ev.type === "comment") {
    if (state._currentVersionId && ev.comment && ev.comment.assetVersionId === state._currentVersionId) {
      await refreshComments(state._currentVersionId);
      REMOTE_COMMENTS_FOR_SELECTED = REMOTE_COMMENTS[state._currentVersionId];
      scheduleRender();
    } else if (ev.projectId && ev.projectId !== state.selectedProjectId) {
      state.notificationsByProject[ev.projectId] = (state.notificationsByProject[ev.projectId] || 0) + 1;
      scheduleRender();
    }
    if (ev.projectId && REMOTE_SOURCES[ev.projectId]) scheduleProjectSourcesRefresh(ev.projectId, 250);
  }
}

let REMOTE_PROJECTS = null; // array of remote-shape projects (with team, sourcesCount, commentsCount, status)
const REMOTE_SOURCES = {}; // pid -> array
const REMOTE_MEMBERS_BY_PROJECT = {}; // pid -> array
const REMOTE_VERSIONS_BY_ASSET = {}; // assetId -> array
const REMOTE_COMMENTS = {}; // versionId -> array
const REMOTE_RENDITIONS = {}; // versionId -> array
const REMOTE_SOURCE_REFRESH_TIMERS = {}; // pid -> timeout
const REMOTE_SOURCE_REFRESH_INFLIGHT = {}; // pid -> promise

async function refreshProjectSources(pid) {
  if (!pid || !remote.me) return;
  if (REMOTE_SOURCE_REFRESH_INFLIGHT[pid]) return REMOTE_SOURCE_REFRESH_INFLIGHT[pid];
  REMOTE_SOURCE_REFRESH_INFLIGHT[pid] = (async () => {
    try { REMOTE_SOURCES[pid] = await api("/projects/" + pid + "/sources"); } catch (_) {}
    finally { delete REMOTE_SOURCE_REFRESH_INFLIGHT[pid]; }
    return REMOTE_SOURCES[pid];
  })();
  return REMOTE_SOURCE_REFRESH_INFLIGHT[pid];
}

function scheduleProjectSourcesRefresh(pid, delayMs = 200) {
  if (!pid || !remote.me) return;
  if (REMOTE_SOURCE_REFRESH_TIMERS[pid]) clearTimeout(REMOTE_SOURCE_REFRESH_TIMERS[pid]);
  REMOTE_SOURCE_REFRESH_TIMERS[pid] = setTimeout(() => {
    delete REMOTE_SOURCE_REFRESH_TIMERS[pid];
    refreshProjectSources(pid).then(() => scheduleRender()).catch(() => {});
  }, delayMs);
}
async function refreshProjectMembers(pid) {
  if (!pid || !remote.me) return;
  try { REMOTE_MEMBERS_BY_PROJECT[pid] = await api("/projects/" + pid + "/members"); } catch (_) {}
}

async function refreshComments(versionId) {
  if (!versionId || !remote.me) return;
  try {
    REMOTE_COMMENTS[versionId] = await api("/asset-versions/" + versionId + "/comments");
    // Re-point the render-time reference: applyRemoteToState() reads
    // REMOTE_COMMENTS_FOR_SELECTED on every render, and the fetch above just
    // replaced the array it pointed at — without this, new comments only
    // appear after a full page reload.
    if (versionId === state._currentVersionId) REMOTE_COMMENTS_FOR_SELECTED = REMOTE_COMMENTS[versionId];
  } catch (_) {}
}
async function refreshRenditions(versionId) {
  if (!versionId || !remote.me) return;
  try { REMOTE_RENDITIONS[versionId] = await api("/asset-versions/" + versionId + "/renditions"); } catch (_) {}
}
async function refreshAssetVersions(assetId) {
  if (!assetId || !remote.me) return;
  try { REMOTE_VERSIONS_BY_ASSET[assetId] = await api("/assets/" + assetId + "/versions"); } catch (_) {}
}

// ---- archive / audit ----
function prepareAuditEntries(rawEntries) {
  return rawEntries.map((e) => {
    const dt = e.createdAt ? new Date(e.createdAt) : null;
    const payload = e.payload || {};
    const snippet = payload.snippet ? payload.snippet : (payload.title ? "« " + payload.title + " »" : (payload.role ? "role=" + payload.role : (payload.userName ? "user=" + payload.userName : "")));
    return {
      ...e,
      timeLabel: dt ? dt.toLocaleString("vi-VN", { dateStyle: "short", timeStyle: "short" }) : "",
      payloadSummary: snippet,
    };
  });
}
async function openAudit() {
  setState({ showAudit: true, auditEntries: [] });
  if (!remote.me) return;
  try {
    const entries = await api("/projects/" + state.selectedProjectId + "/audit?limit=200");
    state.auditEntries = entries;
    render();
  } catch (err) {
    state.auditEntries = [{ id: "err", action: "error", payload: { snippet: err.message }, createdAt: new Date().toISOString() }];
    render();
  }
}
async function archiveSelectedProject() {
  if (!confirm("Archive project này? Project sẽ ẩn khỏi workspace nhưng có thể khôi phục.")) return;
  if (!remote.me) {
    state.sourcesByProject = { ...state.sourcesByProject };
    setState({ view: "projects" });
    return;
  }
  try {
    await api("/projects/" + state.selectedProjectId + "/archive", { method: "POST" });
    await loadRemote();
    setState({ view: "projects" });
  } catch (err) { alert("Archive thất bại: " + err.message); }
}
async function restoreSelectedProject() {
  if (!remote.me) { render(); return; }
  try {
    await api("/projects/" + state.selectedProjectId + "/restore", { method: "POST" });
    await loadRemote();
    render();
  } catch (err) { alert("Khôi phục thất bại: " + err.message); }
}
async function toggleShowArchived() {
  const next = !state.showArchived;

  if (remote.me) {
    try { REMOTE_PROJECTS = await api("/projects" + (next ? "?includeArchived=1" : "")); }

}

async function remotePostComment(versionId, content, timestampMs, frameNumber, annotation, parentId) {
  if (!remote.me) return;
  const body = { content, timestampMs, frameNumber };
  if (annotation && ((annotation.strokes && annotation.strokes.length) || (annotation.texts && annotation.texts.length))) body.annotation = annotation;
  if (parentId) body.parentId = parentId;
  try { await api("/asset-versions/" + versionId + "/comments", { method: "POST", body }); await refreshComments(versionId); render(); }
  catch (err) { toast("Không gửi được comment: " + ((err && err.message) || "lỗi mạng"), "error"); }
}

  const comment = state.comments.find((c) => c.id === commentId);
  if (!comment) return;
  setState({ editingCommentId: commentId, editingCommentText: comment.content, commentMenuId: null });
}
function cancelEditComment() {
  setState({ editingCommentId: null, editingCommentText: "", commentMenuId: null });
}
function saveEditComment(commentId) {
  const text = (state.editingCommentText || "").trim();
  if (!text) return;
  state.comments = state.comments.map((c) => c.id === commentId ? { ...c, content: text, ago: "vừa xong" } : c);
  state.editingCommentId = null;
  state.editingCommentText = "";
  render();
  if (remote.me) remoteEditComment(commentId, text);
}
function deleteCommentById(commentId) {
  state.comments = state.comments.filter((c) => c.id !== commentId);
  state.commentMenuId = null;
  state.editingCommentId = state.editingCommentId === commentId ? null : state.editingCommentId;
  render();
  if (remote.me) remoteDeleteComment(commentId);
}

        : `${field("loginAccount", "Tài khoản", auth.account, "text", "autofocus")}

      ${auth.error ? `<div style="margin-top:22px;font-size:13px;color:var(--co-bad);line-height:1.6;">${esc(auth.error)}</div>` : ""}

        <div style="flex:1"></div>
        ${mBtn("filled", { act: "doLogin", disabled: auth.busy || !remote.connected, label: auth.busy ? "Đang xác thực…" : (!remote.connected ? "Chờ kết nối…" : (auth.needsOtp ? "Xác nhận" : "Đăng nhập")) })}

    </div>

async function doLogin() {
  if (auth.busy) return;
  // pick up the latest values from the form (so we don't lose what the user typed between renders)
  const acc = document.getElementById("loginAccount"); if (acc) auth.account = acc.value;
  const pw = document.getElementById("loginPasswd"); if (pw) auth.passwd = pw.value;
  const otp = document.getElementById("loginOtp"); if (otp) auth.otp = otp.value;
  if (!auth.account || !auth.passwd) { auth.error = "Nhập tài khoản và mật khẩu"; return render(); }
  auth.busy = true; auth.error = ""; render();
  try {
    const body = { account: auth.account, passwd: auth.passwd };
    if (auth.needsOtp) body.otp_code = auth.otp;
    const r = await api("/auth/dsm/login", { method: "POST", body });
    if (r.needsOtp) {
      auth.needsOtp = true;
      auth.busy = false;
      auth.error = r.error || (r.otpInvalid ? "Mã OTP sai hoặc đã hết hạn — thử mã mới" : "");
      if (r.otpInvalid) auth.otp = ""; // wipe so the input is ready for retype
      return render();
    }
    // Logged in. Dismiss the overlay BEFORE awaiting loadRemote — otherwise the
    // user stares at "Đang xác thực…" for a few seconds while projects/users load,
    // which feels like a hang.
    remote.me = r.user; remote.canUseScripts = !!r.canUseScripts; auth.busy = false; auth.needsOtp = false; auth.passwd = ""; auth.otp = "";
    render();
    loadRemote()
      .then(() => render())
      .catch((err2) => { remote.error = err2 && err2.message; render(); });
  } catch (err) {
    auth.busy = false;
    auth.error = (err && err.message) || "Đăng nhập thất bại";
    auth.otp = ""; // wipe wrong OTP so user can retype cleanly
    render();
  }
}

async function doLogout() {
  closeEventStream();
  stopPresence();
  try { await api("/auth/logout", { method: "POST" }); } catch (_) {}
  remote.me = null; remote.presence = []; render();
}

function createNewProject() {
  if (!remote.me) return;
  // Open the proper form modal instead of the old two-step window.prompt().
  setStateNow({
    showCreateProject: true,
    createProjectName: "",
    createProjectClient: "",
    createProjectThumbDataUrl: "",
    createProjectBusy: false,
    createProjectError: "",
  });
  // Focus the name input after the modal mounts.
  setTimeout(() => {
    const el = document.getElementById("createProjectNameInput");
    if (el) el.focus();
    window.__syncCreateProjectForm && window.__syncCreateProjectForm();
  }, 0);
}

function closeCreateProjectModal() {
  setStateNow({ showCreateProject: false, createProjectBusy: false, createProjectError: "" });
}

async function submitCreateProject() {
  const name = (state.createProjectName || "").trim();
  if (!name) { state.createProjectError = "Cần nhập tên project"; render(); return; }
  state.createProjectBusy = true;
  state.createProjectError = "";
  render();
  try {
    const client = (state.createProjectClient || "").trim();
    const proj = await api("/projects", { method: "POST", body: { name, client } });
    // Thumbnail upload: backend doesn't accept it yet on POST, so PATCH with
    // the data-URL into the (forward-compatible) thumbDataUrl field. Backend
    // ignores unknown fields today; when the column lands the upload is
    // already wired.
    if (state.createProjectThumbDataUrl) {
      try { await api("/projects/" + proj.id, { method: "PATCH", body: { thumbDataUrl: state.createProjectThumbDataUrl } }); } catch (_) {}
    }
    REMOTE_PROJECTS = await api("/projects");
    state.selectedProjectId = proj.id;
    state.view = "project";
    state.showCreateProject = false;
    state.createProjectBusy = false;
    state.createProjectName = "";
    state.createProjectClient = "";
    state.createProjectThumbDataUrl = "";
    await refreshProjectSources(proj.id);
    await refreshProjectMembers(proj.id);
    render();
  } catch (err) {
    state.createProjectBusy = false;
    state.createProjectError = "Tạo project thất bại: " + ((err && err.message) || "lỗi không xác định");
    render();
  }
}

async function editSelectedProject() {
  const project = PROJECTS.find((item) => item.id === state.selectedProjectId);
  if (!project) return;
  const name = window.prompt("Tên project:", project.name || "");
  if (!name || !name.trim()) return;
  const client = window.prompt("Client:", project.client || "") || "";
  try {
    await remotePatchProject(project.id, { name: name.trim(), client: client.trim() });
  } catch (err) {
    window.alert("Sửa project thất bại: " + ((err && err.message) || "lỗi không xác định"));
  }
}

async function deleteSelectedProject() {
  const project = PROJECTS.find((item) => item.id === state.selectedProjectId);
  if (!project) return;
  if (!window.confirm("Xóa vĩnh viễn project \"" + project.name + "\" và toàn bộ video/comment bên trong?")) return;
  try {
    await remoteDeleteProject(project.id);
    state.view = "projects";
    state.selectedProjectId = "";
    render();
  } catch (err) {
    window.alert("Xóa project thất bại: " + ((err && err.message) || "lỗi không xác định"));
  }
}

async function editSourceById(assetId) {
  const src = ((state.sourcesByProject[state.selectedProjectId] || []).find((item) => item.id === assetId)) || null;
  if (!src) return;
  const title = window.prompt("Tên video:", src.title || "");
  if (!title || !title.trim()) return;
  try {
    await remotePatchAsset(assetId, { title: title.trim() });
    render();
  } catch (err) {
    window.alert("Sửa video thất bại: " + ((err && err.message) || "lỗi không xác định"));
  }
}

async function deleteSourceById(assetId) {
  const src = ((state.sourcesByProject[state.selectedProjectId] || []).find((item) => item.id === assetId)) || null;
  if (!src) return;
  if (!window.confirm("Xóa video \"" + src.title + "\" khỏi project này?")) return;
  try {
    await remoteDeleteAsset(assetId);
    if (state.selectedId === assetId) {
      const remaining = state.sourcesByProject[state.selectedProjectId] || [];
      state.selectedId = remaining[0] ? remaining[0].id : "";
      if (!remaining.length) state.view = "project";
    }
    render();
  } catch (err) {
    window.alert("Xóa video thất bại: " + ((err && err.message) || "lỗi không xác định"));
  }
}

function currentFocus() {
  if (state.view === "review") return { kind: "source", id: state.selectedId, projectId: state.selectedProjectId };
  if (state.view === "project") return { kind: "project", id: state.selectedProjectId };
  return { kind: "workspace" };
}
async function sendPresence() {
  if (!remote.me) return;
  try { await api("/presence", { method: "POST", body: { focus: currentFocus() } }); } catch (_) {}
}
function startPresence() {
  if (presenceTimer) return;
  sendPresence();
  presenceTimer = setInterval(sendPresence, 25_000);
}
function stopPresence() {
  if (presenceTimer) { clearInterval(presenceTimer); presenceTimer = null; }
  if (remote.me) { try { fetch(API_BASE + "/presence", { method: "DELETE", credentials: "include" }); } catch (_) {} }
}
window.addEventListener("beforeunload", () => { if (remote.me) navigator.sendBeacon && navigator.sendBeacon(API_BASE + "/presence?leave=1"); });

function doInviteMember() {
  if (!state.inviteUserId) return;
  const projectId = state.selectedProjectId;
  const userId = state.inviteUserId;
  const role = state.inviteRole;
  state.inviteUserId = "";
  state.inviteRole = "reviewer";
  render();
  if (remote.me) {
    remoteInviteProjectMember(projectId, userId, role).catch((err) => {
      window.alert("Không thể thêm thành viên: " + ((err && err.message) || "lỗi không xác định"));
    });
  }
}
function removeMember(userId) {
  if (!userId) return;
  if (!window.confirm("Gỡ thành viên này khỏi project?")) return;
  remoteRemoveProjectMember(state.selectedProjectId, userId).catch((err) => {
    window.alert("Không thể gỡ thành viên: " + ((err && err.message) || "lỗi không xác định"));
  });
}

// patch handleAct to recognize new actions
const _origHandleAct = handleAct;
handleAct = function (act, arg, e, node) {
  switch (act) {
    case "applySetup": return applySetup();
    case "doLogin": return doLogin();
    case "cancelOtp": auth.needsOtp = false; auth.error = ""; auth.otp = ""; return render();
    case "doLogout": return doLogout();
    case "createProject": return createNewProject();
    case "closeCreateProject": return closeCreateProjectModal();
    case "submitCreateProject": return submitCreateProject();
    case "clearCreateProjectThumb": state.createProjectThumbDataUrl = ""; return render();
    case "retryBoot":
      // Force immediate retry (skip the 5s timer) — used by the "Thử lại ngay" button on the offline banner.
      if (_bootRetryTimer) { clearTimeout(_bootRetryTimer); _bootRetryTimer = null; }
      remote.error = "Đang thử lại…"; render();
      return tryBootProbe();
  }
  return _origHandleAct(act, arg, e, node);
};

// Intercept render() to overlay the login modal when needed and to swap in remote data when available.
const _origRender = render;
render = function () {
  if (remote.setup && remote.setup.configured === false) {
    const app = document.getElementById("app");
    document.documentElement.setAttribute("data-theme", state.theme);
    app.setAttribute("data-theme", state.theme);
    app.innerHTML = setupOverlay();
    return;
  }
  // Show login (or connection-error) overlay whenever user isn't authenticated.
  if (!remote.me) {
    const app = document.getElementById("app");
    document.documentElement.setAttribute("data-theme", state.theme);
    app.setAttribute("data-theme", state.theme);
    app.innerHTML = loginOverlay();
    setTimeout(() => {
      const f = document.getElementById(auth.needsOtp ? "loginOtp" : "loginAccount");
      if (f) f.focus();
    }, 0);
    return;
  }
  // hydrate state from remote data if available
  applyRemoteToState();
  _origRender();
  bindReviewVideo();
  bindTimelinePreview();
};

function applyRemoteToState() {
  window.__presenceList = remote.me && remote.presence && remote.presence.length ? remote.presence : null;
  window.__projectMembersByProject = REMOTE_MEMBERS_BY_PROJECT;
  window.__versionsByAsset = REMOTE_VERSIONS_BY_ASSET;
  if (!REMOTE_PROJECTS) return;
  const transformedProjects = (REMOTE_PROJECTS || []).map((p) => ({
    id: p.id, name: p.name, status: p.status, client: p.client,
    updated: p.updatedAt || p.updated || "",
    createdAt: p.createdAt || "",
    storage: p.storage || "",
    thumbUrl: p.thumbUrl ? apiMediaUrl(p.thumbUrl) : "",
    a: p.paletteA || p.a || "#15171c",
    b: p.paletteB || p.b || "#3a4453",
    team: (p.team || []).map((u) => Array.isArray(u) ? u : [u.initial, u.color]),
    members: p.members || [],
    // Fields below the original shape didn't have but downstream code reads
    // (computeVals → canManageAccess / canManageUpdates / canManageProject).
    // Without these, owner-gated UI (proxy storage manager, DSM picker,
    // Sửa/Xóa buttons, audit panel) silently hides for actual owners.
    myRole: p.myRole,
    archivedAt: p.archivedAt,
    airDate: p.airDate || null,
  }));
  PROJECTS_REF.length = 0; transformedProjects.forEach((x) => PROJECTS_REF.push(x));
  const byProj = {};
  for (const pid of Object.keys(REMOTE_SOURCES)) {
    byProj[pid] = REMOTE_SOURCES[pid].sort((a, b) => a.position - b.position).map((s) => ({
      id: s.id, title: s.title, dur: s.durationMs, codec: s.codec, size: s.sizeLabel,
      width: s.width || 0, height: s.height || 0, resolutionLabel: s.resolutionLabel || "",
      nasPath: s.nasPath || s.path || "",
      posterUrl: apiMediaUrl("/assets/" + s.id + "/poster"),
      playbackUrl: apiMediaUrl("/assets/" + s.id + "/source"),
      status: s.status, progress: s.progress, versions: s.versionsCount, comments: s.commentsCount,
      airDate: s.airDate || null,
      a: s.paletteA, b: s.paletteB,
    }));
  }
  state.sourcesByProject = { ...state.sourcesByProject, ...byProj };
  const selectedProjectSources = state.sourcesByProject[state.selectedProjectId] || [];
  if (selectedProjectSources.length && !selectedProjectSources.some((source) => source.id === state.selectedId)) {
    state.selectedId = selectedProjectSources[0].id;
    state.duration = selectedProjectSources[0].dur || state.duration;
  }
  if (state._currentVersionId && REMOTE_RENDITIONS[state._currentVersionId]) {
    const renditionMap = {};
    REMOTE_RENDITIONS[state._currentVersionId].forEach((r) => { renditionMap[r.height] = r; });
    state.qualities = [720, 1080].map((height) => {
      const r = renditionMap[height];
      const label = height + "p";
      const base = {
        id: label,
        label,
        res: height === 720 ? "1280×720" : "1920×1080",
        bitrate: height === 720 ? "3.5 Mbps" : "8 Mbps",
        sub: height === 720 ? "Review mặc định · nhẹ mạng hơn" : "Check chi tiết · cần mạng tốt",
      };
      if (!r) return { ...base, status: "pending", progress: 0 };
      return {
        ...base,
        status: r.status,
        progress: r.progress || 0,
        lastError: r.lastError || "",
        lastJobStatus: r.lastJobStatus || "",
        lastJobAt: r.lastJobAt || null,
      };
    });
  }
  if (REMOTE_COMMENTS_FOR_SELECTED) {
    state.comments = REMOTE_COMMENTS_FOR_SELECTED.filter((c) => !c.parentId).map((c) => {
      const replies = REMOTE_COMMENTS_FOR_SELECTED.filter((r) => r.parentId === c.id).map((r) => ({
        id: r.id,
        who: guestAuthorKey(r) || mapAuthor(r.authorUserId),
        authorKey: r.guestLabel ? ("guest:" + r.id) : (r.authorUserId || r.id),
        content: r.content,
        ms: r.timestampMs,
        resolved: !!r.resolved,
        annotation: r.annotation || null,
      }));
      return {
        id: c.id,
        who: guestAuthorKey(c) || mapAuthor(c.authorUserId),
        authorKey: c.guestLabel ? ("guest:" + c.id) : (c.authorUserId || c.id),
        ms: c.timestampMs,
        content: c.content,
        resolved: !!c.resolved, ago: "vừa qua", replies, annotation: c.annotation || null,
      };
    });
  }
}
let REMOTE_COMMENTS_FOR_SELECTED = null;
function mapAuthor(userId) {
  const u = remote.users && remote.users[userId];
  if (!u) return "me";
  return ensureAuthor("u_" + u.id, u);
}
function ensureAuthor(key, u) {
  if (!AUTHORS[key]) AUTHORS[key] = { name: u.name, initial: u.initial, color: u.color, role: u.role === "client" ? "CLIENT" : "" };
  return key;
}

function guestAuthorKey(comment) {
  if (!comment || !comment.guestLabel) return "";
  const label = String(comment.guestLabel || "").trim() || "Khách";
  const initial = String(comment.guestInitial || label.charAt(0).toUpperCase() || "K");
  const color = String(comment.guestColor || "#2bbe6e");
  return ensureAuthor("guest_" + (comment.id || label), { name: label, initial, color, role: "client" });
}

const PROJECTS_REF = PROJECTS;

// hook openSource/openProject to refresh remote data
const _origOpenProject = openProject;
openProject = async function (pid) {
  _origOpenProject(pid);
  delete state.notificationsByProject[pid];
  if (remote.me) { sendPresence(); await refreshProjectSources(pid); await refreshProjectMembers(pid); render(); }
};
const _origOpenSource = openSource;
openSource = async function (id) {
  _origOpenSource(id);
  if (!remote.me) return;
  sendPresence();
  try {
    await refreshAssetVersions(id);
    const versions = REMOTE_VERSIONS_BY_ASSET[id] || [];
    const current = versions.slice(-1)[0];
    if (current) {
      state._currentVersionId = current.id;
      state.version = current.id;
      await refreshComments(current.id);
      await refreshRenditions(current.id);
      REMOTE_COMMENTS_FOR_SELECTED = REMOTE_COMMENTS[current.id] || null;
    } else {
      state._currentVersionId = "";
      state.version = "v1";
      REMOTE_COMMENTS_FOR_SELECTED = [];
      state.comments = [];
    }
    render();
  } catch (_) {}
};
const _origGoProjects = goProjects;
goProjects = function () {
  _origGoProjects();
  state.notificationsByProject = {};
  if (remote.me) sendPresence();
};

// wrap mutation handlers to also write to API
const _origPostComment = postComment;
postComment = function () {
  const text = (state.newComment || "").trim();
  // Snapshot annotation BEFORE the local stub clears state.newComment
  const annotation = ((state.annotationStrokes && state.annotationStrokes.length) || (state.annotationTexts && state.annotationTexts.length))
    ? { strokes: (state.annotationStrokes || []).slice(), texts: (state.annotationTexts || []).slice() }
    : null;
  const parentId = state.replyingTo;
  _origPostComment();
  if (remote.me && state._currentVersionId && text) {
    remotePostComment(state._currentVersionId, text, Math.round(state.currentMs), Math.round(state.currentMs / 1000 * state.fps), annotation, parentId);
  }
  // Clear reply target after sending
  if (parentId) { state.replyingTo = null; state.replyingToTcLabel = ""; }
  // After post: clear the annotation draft (and its history) for a clean next comment
  if (annotation) {
    state.annotationStrokes = [];
    state.annotationTexts = [];
    state.annotationDrawing = null;
    state.annotationSelId = null;
    state.annotationUndo = [];
    state.annotationRedo = [];
    render();
  }
};
const _origToggleResolve = toggleResolve;
toggleResolve = function (id) {
  const c = state.comments.find((x) => x.id === id);
  const newResolved = c ? !c.resolved : true;
  _origToggleResolve(id);
  if (remote.me) remoteToggleResolve(id, newResolved);
};
const _origReorder = reorder;
reorder = function (fromId, toId) {
  _origReorder(fromId, toId);
  const pid = state.selectedProjectId;
  const order = (state.sourcesByProject[pid] || []).map((x) => x.id);
  if (remote.me) remoteReorder(pid, order);
};
const _origMoveBy = moveBy;
moveBy = function (id, dir) {
  _origMoveBy(id, dir);
  const pid = state.selectedProjectId;
  const order = (state.sourcesByProject[pid] || []).map((x) => x.id);
  if (remote.me) remoteReorder(pid, order);
};
const _origDoImport = doImport;
doImport = function () {
  return _origDoImport();
};
const _origRequestTranscode = requestTranscode;
requestTranscode = function (id) {
  _origRequestTranscode(id);
  const clearPending = () => {
    if (!state._proxyRequestPending) return;
    const next = { ...state._proxyRequestPending };
    delete next[id];
    state._proxyRequestPending = next;
    render();
  };
  if (remote.me && state._currentVersionId) {
    const h = id === "720p" ? 720 : 1080;
    remoteRequestTranscode(state._currentVersionId, h)
      .then(() => {
        clearPending();
        toast("Đã gửi yêu cầu tạo proxy " + id + " · worker sẽ xử lý trong giây lát");
        refreshRenditions(state._currentVersionId).then(render).catch(() => {});
      })
      .catch((err) => {
        clearPending();
        toast("Không tạo được proxy: " + ((err && err.message) || "lỗi không xác định"), "error");
        refreshRenditions(state._currentVersionId).then(render).catch(() => {});
      });
  } else {
    // Sim/offline mode — give visible feedback even though there's no worker.
    setTimeout(() => { clearPending(); toast("Đã ghi nhận yêu cầu (chế độ sim — không có worker)"); }, 300);
  }
};

function toast(msg, kind) {
  // Lightweight top-right notification. No external dep, no lib. Auto-dismiss
  // after 3.5s so the user sees the system acknowledged their click.
  const host = (() => {
    let n = document.getElementById("co-toast-host");
    if (n) return n;
    n = document.createElement("div");
    n.id = "co-toast-host";
    n.style.cssText = "position:fixed;top:14px;right:14px;display:flex;flex-direction:column;gap:8px;z-index:99999;pointer-events:none;";
    document.body.appendChild(n);
    return n;
  })();
  const card = document.createElement("div");
  const isErr = kind === "error";
  card.style.cssText = "background:var(--co-glass);backdrop-filter:blur(14px);color:" + (isErr ? "var(--co-bad)" : "var(--co-text)") + ";padding:12px 17px;border-radius:12px;box-shadow:var(--co-shadow);font-size:13px;max-width:360px;pointer-events:auto;animation:coFade 180ms ease;";
  card.textContent = msg;
  host.appendChild(card);
  setTimeout(() => { card.style.opacity = "0"; card.style.transform = "translateY(-6px)"; card.style.transition = "all 200ms ease-in"; }, 3300);
  setTimeout(() => { try { card.remove(); } catch (_) {} }, 3550);
}
// patch project status writes
const _origSetProjectStatusHandler = handleAct;
// (handled inline above via switch — we tap setProjectStatus through the action setter)

// hook into the existing setProjectStatus action by wrapping setState calls is messy;
// simpler: intercept at the action dispatcher level. Already-wrapped above doesn't cover it,
// so add a second wrapper here that fires after the original handler runs.
const _wrappedHandleAct2 = handleAct;
handleAct = function (act, arg, e, node) {
  const r = _wrappedHandleAct2(act, arg, e, node);
  if (act === "setProjectStatus" && remote.me) remotePatchProject(state.selectedProjectId, { status: arg });
  return r;
};

bootstrap();
