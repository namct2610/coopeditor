<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Coopeditor — Coopeditor</title>
<link rel="icon" type="image/png" sizes="32x32" href="brand/favicon-32.png" />
<link rel="icon" type="image/png" sizes="256x256" href="brand/favicon-256.png" />
<link rel="apple-touch-icon" sizes="180x180" href="brand/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap" />
<!-- hls.js: Chrome/Firefox/Edge không native phát HLS .m3u8. Safari thì phát
     được luôn (Mac/iOS). Library này hook vào <video> qua MSE để phát proxy. -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.20/dist/hls.min.js"></script>
<style>
  /* ===================================================================
     Nocturne — rebuilt wholesale from claude.ai/design/p/6ace84d7…
     (Coopeditor.dc.html). The old panelled/bordered Synoframe skin is
     gone: this design is typography-led and flat. Rules of the system:
       * no card chrome — rows are separated by a 5.5% hairline, nothing else
       * no filled buttons except the round accent play control
       * actions are accent-coloured text, not pills
       * overlays are content floating on a blurred scrim, not boxed modals
       * one accent (#9184d9) carries every interactive affordance
     Token NAMES are kept from the old skin so surfaces not yet rewritten
     inherit the new palette instead of stranding on dead colours.
     =================================================================== */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  :root, [data-theme="dark"] {
    --co-bg:#161826; --co-stage:#0d0e18; --co-chrome:#161826; --co-panel:#1e2030; --co-panel-2:#232532; --co-menu:#1e2030;
    --co-text:#e9e9ed; --co-text-2:#b2b6ca; --co-muted:#9397ab; --co-faint:#75798c; --co-dim:#8b8fa3; --co-comment:#d7d8e0;
    /* hairline is the design's row separator; border/border-2 are the rare heavier rules */
    --co-hairline:rgba(233,233,237,0.055);
    --co-border:rgba(233,233,237,0.09); --co-border-2:rgba(233,233,237,0.16); --co-hover:rgba(233,233,237,0.05);
    --co-glass:rgba(22,24,38,0.82); --co-scrim:rgba(11,12,20,0.72);
    /* inert bars, rings and rails — the "off" state of a track */
    --co-track:rgba(233,233,237,0.12); --co-track-2:rgba(233,233,237,0.2); --co-scrollbar:rgba(233,233,237,0.12);
    --co-tonal-bg:rgba(145,132,217,0.20); --co-tonal-line:transparent; --co-btn-outline:rgba(145,132,217,0.5); --co-btn-shadow:0 0 #0000; --co-on-accent:#0d0e18;
    --co-shadow:0 0 #0000;
    --co-accent:#9184d9; --co-accent-text:#9184d9; --co-accent-ink:#d2cefd;
    --co-accent-soft:rgba(145,132,217,0.14); --co-accent-line:rgba(145,132,217,0.42);
    --co-ok:#2bbe6e; --co-warn:#d9a45b; --co-bad:#ef4d57;
  }
  /* The design is dark-only. Light stays as a derived mapping so the theme
     toggle (now a Settings row) keeps working rather than being deleted. */
  [data-theme="light"] {
    --co-bg:#f4f4f8; --co-stage:#0d0e18; --co-chrome:#f4f4f8; --co-panel:#ffffff; --co-panel-2:#ececf3; --co-menu:#ffffff;
    --co-text:#161826; --co-text-2:#3f424d; --co-muted:#5c6072; --co-faint:#75798c; --co-dim:#5c6072; --co-comment:#1b1b22;
    --co-hairline:rgba(22,24,38,0.10);
    --co-border:rgba(22,24,38,0.09); --co-border-2:rgba(22,24,38,0.16); --co-hover:rgba(22,24,38,0.04);
    --co-glass:rgba(255,255,255,0.94); --co-scrim:rgba(228,228,238,0.94);
    --co-track:rgba(22,24,38,0.14); --co-track-2:rgba(22,24,38,0.22); --co-scrollbar:rgba(22,24,38,0.18);
    --co-tonal-bg:rgba(145,132,217,0.32); --co-tonal-line:rgba(93,82,160,0.70); --co-btn-outline:rgba(93,82,160,0.70); --co-btn-shadow:0 1px 3px rgba(22,24,38,0.20); --co-on-accent:#ffffff;
    --co-shadow:0 1px 2px rgba(22,24,38,0.06), 0 8px 22px rgba(22,24,38,0.10);
    --co-accent:#9184d9; --co-accent-text:#6a5abf; --co-accent-ink:#5d52a0;
    --co-accent-soft:rgba(145,132,217,0.12); --co-accent-line:rgba(145,132,217,0.38);
    --co-ok:#1d9c56; --co-warn:#b4802f; --co-bad:#d43a44;
  }
  body { background: var(--co-bg); color: var(--co-text); font-family: "Onest", -apple-system, system-ui, sans-serif; font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; overflow: hidden; }
  a { color: var(--co-accent); text-decoration: none; }
  a:hover { color: var(--co-accent-ink); }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: var(--co-scrollbar); border-radius: 999px; border: 2px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-track { background: transparent; }
  textarea, input, button, select { font-family: inherit; }
  @keyframes coFade { from { opacity: 0 } to { opacity: 1 } }
  @keyframes coPulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  @keyframes coSpin { to { transform: rotate(360deg); } }

  /* Row hover: the design has no hover fill on list rows — the title lifts
     to full-strength text instead. .co-row is the flat list row primitive. */
  .co-row { cursor: pointer; }
  .co-row:hover .co-row-title { color: var(--co-text); }
  .co-row:hover .co-row-rail { background: var(--co-accent) !important; }
  .co-act:hover { color: var(--co-accent-ink) !important; }

  /* ===== Material 3 buttons =====================================================
     Only the primary action affordances (CTAs) use these — the flat accent-text
     actions stay as they are. Filled = primary; tonal/outlined/text = secondary.
     onPrimary is dark ink (#0d0e18), not white: the accent #9184d9 is light, so
     dark text on it clears contrast while white (2.9:1) would not. Matches the
     round play control, which already used dark ink on accent. */
  .m-btn { position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    height: 38px; padding: 0 22px; border-radius: 999px; border: none; background: transparent;
    font-family: inherit; font-size: 13.5px; font-weight: 500; letter-spacing: 0.1px; line-height: 1;
    flex-shrink: 0; cursor: pointer; white-space: nowrap; user-select: none; -webkit-tap-highlight-color: transparent;
    transition: box-shadow .18s ease, background .18s ease, border-color .18s ease, filter .18s ease; }
  .m-btn:disabled, .m-btn[aria-disabled="true"] { opacity: .55; pointer-events: none; }
  .m-btn--filled { background: var(--co-accent); color: var(--co-on-accent); box-shadow: var(--co-btn-shadow); }
  .m-btn--filled:hover { box-shadow: 0 2px 6px rgba(22,24,38,.18), 0 6px 18px rgba(145,132,217,.42); filter: brightness(1.04); }
  .m-btn--tonal { background: var(--co-tonal-bg); color: var(--co-accent-text); border: 1px solid var(--co-tonal-line); }
  .m-btn--tonal:hover { filter: brightness(1.12); }
  .m-btn--outlined { border: 1px solid var(--co-btn-outline); color: var(--co-accent-text); }
  .m-btn--outlined:hover { border-color: var(--co-accent-line); background: var(--co-accent-soft); }
  .m-btn--text { color: var(--co-accent-text); padding: 0 14px; }
  .m-btn--text:hover { background: var(--co-accent-soft); }
  .m-btn--neutral { color: var(--co-muted); padding: 0 14px; }
  .m-btn--neutral:hover { background: var(--co-hover); color: var(--co-text); }
  .m-btn--icon { width: 38px; padding: 0; border-radius: 50%; }
  .m-btn--sm { height: 32px; padding: 0 16px; font-size: 12.5px; }
  .m-btn--sm.m-btn--icon { width: 32px; padding: 0; }
  /* Ripple: currentColor state layer, spawned on pointerdown (see JS below). */
  .m-ripple { position: absolute; border-radius: 50%; transform: scale(0); background: currentColor; opacity: .26; pointer-events: none; animation: mRipple .5s cubic-bezier(.2,.6,.35,1) forwards; }
  @keyframes mRipple { to { transform: scale(2.4); opacity: 0; } }
  .co-hover:hover { background: var(--co-hover) !important; }
  .co-border-hover:hover { border-color: var(--co-accent-line) !important; }
  .co-border-hover-strong:hover { border-color: var(--co-accent-line) !important; }
  .co-card-hover:hover { filter: brightness(1.08); }
  .co-btn-blue:hover { filter: brightness(1.08); }
  .co-text-hover:hover { color: var(--co-text) !important; }
  .co-blue-hover:hover { color: var(--co-accent-ink) !important; }
  .co-attach-hover:hover { background: rgba(255,255,255,0.12) !important; }
  textarea:focus, input:focus { outline: none; }
  .dp-day:hover { background: var(--co-hover); }

  /* ===== Kịch bản editor (Docs-like) ===================================== */
  #scriptTitle:focus { outline: none; }
  #scriptTitle::placeholder { color: var(--co-faint); }
  .script-toolbar { position: sticky; top: -28px; z-index: 20; margin: 0 0 14px; padding: 5px 6px; border-radius: 14px;
    background: var(--co-menu); border: 1px solid var(--co-border-2); box-shadow: 0 6px 20px rgba(0,0,0,.12); }
  .tb-row { display: flex; flex-wrap: wrap; align-items: center; gap: 1px; }
  .tb-row--table { margin-top: 5px; padding-top: 5px; border-top: 1px solid var(--co-hairline); }
  .tb-btn { height: 32px; min-width: 32px; padding: 0 7px; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; gap: 4px;
    border-radius: 8px; cursor: pointer; color: var(--co-text-2); font-size: 13.5px; user-select: none; white-space: nowrap; }
  .tb-btn:hover { background: var(--co-hover); color: var(--co-text); }
  .tb-btn.is-on { background: var(--co-accent-soft); color: var(--co-accent-text); }
  .tb-btn.is-off { opacity: .35; pointer-events: none; }
  .tb-drop { padding-right: 4px; }
  .tb-caret { display: inline-flex; opacity: .55; }
  .tb-size { min-width: 38px; border: 1px solid var(--co-border-2); font-variant-numeric: tabular-nums; }
  .tb-sep { width: 1px; height: 20px; margin: 0 5px; background: var(--co-border-2); }
  .tb-pop { position: absolute; top: calc(100% + 6px); left: 0; z-index: 30; min-width: 120px; max-height: 360px; overflow-y: auto; padding: 6px;
    background: var(--co-menu); border: 1px solid var(--co-border-2); border-radius: 12px; box-shadow: 0 18px 50px rgba(0,0,0,.35); animation: coFade 120ms ease; }
  .tb-item { padding: 7px 10px; border-radius: 8px; cursor: pointer; font-size: 13px; color: var(--co-text-2); white-space: nowrap; }
  .tb-item:hover { background: var(--co-hover); color: var(--co-text); }
  .tb-item.is-on { color: var(--co-accent-text); background: var(--co-accent-soft); }
  .tbl-cell { width: 20px; height: 20px; border-radius: 4px; cursor: pointer; box-shadow: inset 0 0 0 1px var(--co-border-2); }
  .tbl-cell.is-on { background: var(--co-accent-soft); box-shadow: inset 0 0 0 1px var(--co-accent); }

  .script-layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: start; }
  .script-page { background: var(--co-menu); border: 1px solid var(--co-border-2); border-radius: 14px; padding: clamp(28px, 5vw, 56px) clamp(22px, 5.5vw, 64px) 80px; min-height: 72vh; box-sizing: border-box; }
  .script-doc { outline: none; font-size: 16px; line-height: 1.7; color: var(--co-text-2); caret-color: var(--co-accent); word-break: break-word; min-height: 55vh; }
  .script-doc > * + * { margin-top: .6em; }
  .script-doc p { margin: 0; }
  .script-doc h1 { font-size: 28px; font-weight: 650; letter-spacing: -0.02em; line-height: 1.3; color: var(--co-text); margin: 1.1em 0 .3em; }
  .script-doc h2 { font-size: 22px; font-weight: 600; letter-spacing: -0.015em; line-height: 1.35; color: var(--co-text); margin: 1.05em 0 .25em; }
  .script-doc h3 { font-size: 18px; font-weight: 600; color: var(--co-text); margin: 1em 0 .2em; }
  .script-doc > :first-child { margin-top: 0; }
  .script-doc ul, .script-doc ol { padding-left: 1.6em; margin: .4em 0; }
  .script-doc li > p { margin: 0; }
  .script-doc li + li { margin-top: .2em; }
  .script-doc ul[data-type="taskList"] { list-style: none; padding-left: .2em; }
  .script-doc ul[data-type="taskList"] li { display: flex; gap: 10px; align-items: flex-start; }
  .script-doc ul[data-type="taskList"] li > label { margin-top: .25em; flex: 0 0 auto; }
  .script-doc ul[data-type="taskList"] li > label input { accent-color: var(--co-accent); width: 16px; height: 16px; cursor: pointer; }
  .script-doc ul[data-type="taskList"] li > div { flex: 1; min-width: 0; }
  .script-doc ul[data-type="taskList"] li[data-checked="true"] > div { color: var(--co-faint); text-decoration: line-through; }
  .script-doc blockquote { margin: .8em 0; padding: 4px 0 4px 18px; border-left: 3px solid var(--co-accent); color: var(--co-text); font-style: italic; }
  .script-doc hr { border: none; border-top: 1px solid var(--co-border-2); margin: 1.4em 0; }
  .script-doc a { color: var(--co-accent-text); text-decoration: underline; text-underline-offset: 2px; }
  .script-doc strong, .script-doc b { color: var(--co-text); font-weight: 650; }
  .script-doc code { font-family: ui-monospace, Menlo, monospace; font-size: .9em; background: var(--co-hover); padding: 1px 5px; border-radius: 5px; }
  .script-doc pre { background: var(--co-hover); padding: 12px 14px; border-radius: 10px; overflow-x: auto; }
  .script-doc pre code { background: none; padding: 0; }
  .script-doc mark { border-radius: 2px; padding: 0 1px; color: #1b1b1b; }
  .script-doc p.is-editor-empty:first-child::before { content: attr(data-placeholder); float: left; height: 0; color: var(--co-faint); pointer-events: none; }
  .script-doc .tableWrapper { overflow-x: auto; margin: 1em 0; }
  .script-doc table { border-collapse: collapse; table-layout: fixed; width: 100%; margin: 0; overflow: hidden; }
  .script-doc td, .script-doc th { position: relative; vertical-align: top; box-sizing: border-box; min-width: 60px; padding: 7px 10px; border: 1px solid var(--co-border-2); }
  .script-doc th { background: var(--co-hover); color: var(--co-text); font-weight: 600; text-align: left; }
  .script-doc td > p, .script-doc th > p { margin: 0; }
  .script-doc .selectedCell::after { content: ""; position: absolute; inset: 0; background: var(--co-accent-soft); pointer-events: none; z-index: 2; }
  .script-doc .column-resize-handle { position: absolute; right: -2px; top: 0; bottom: -2px; width: 4px; background: var(--co-accent); pointer-events: none; }
  .script-doc.resize-cursor { cursor: col-resize; }
  .script-doc .ProseMirror-gapcursor:after { border-top-color: var(--co-text); }
  .script-doc .ProseMirror-selectednode { outline: 2px solid var(--co-accent); }

  .sc-bubble { position: absolute; right: -14px; z-index: 15; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; cursor: pointer;
    background: var(--co-accent); color: var(--co-on-accent); font-size: 12.5px; font-weight: 600; box-shadow: 0 8px 22px rgba(0,0,0,.3); }
  .sc-panel { position: sticky; top: 68px; max-height: calc(100vh - 96px); overflow-y: auto; padding-right: 2px; }
  .sc-card { padding: 14px; border-radius: 14px; background: var(--co-menu); border: 1px solid var(--co-border-2); cursor: pointer; transition: box-shadow .15s ease, border-color .15s ease; }
  .sc-card:hover { border-color: var(--co-accent-line); }
  .sc-card.is-active { cursor: default; border-color: var(--co-accent-line); box-shadow: 0 10px 30px rgba(0,0,0,.25); }
  .sc-input { width: 100%; box-sizing: border-box; resize: vertical; background: var(--co-hover); color: var(--co-text); border: 1px solid var(--co-border-2); border-radius: 10px; padding: 9px 11px; font: inherit; font-size: 13px; }
  .sc-input:focus { border-color: var(--co-accent-line); }
  .sc-icon-btn { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 7px; cursor: pointer; font-size: 13px; color: var(--co-muted); flex: 0 0 auto; }
  .sc-icon-btn:hover { background: var(--co-hover); color: var(--co-text); }

  .sp-chip { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px 0 8px; border-radius: 10px; cursor: pointer; font-size: 13px; color: var(--co-text-2);
    background: var(--co-hover); border: 1px solid var(--co-border-2); }
  .sp-chip:hover, .sp-chip.is-on { border-color: var(--co-accent-line); color: var(--co-text); }
  .sp-chip--empty { background: none; border-style: dashed; color: var(--co-muted); padding: 0 12px; }
  .sp-pop { position: absolute; top: calc(100% + 8px); left: 0; z-index: 40; width: 340px; max-width: calc(100vw - 40px); background: var(--co-menu);
    border: 1px solid var(--co-border-2); border-radius: 14px; box-shadow: 0 22px 60px rgba(0,0,0,.4); animation: coFade 120ms ease; }
  .sp-item { display: flex; align-items: center; gap: 11px; padding: 8px; border-radius: 10px; cursor: pointer; }
  .sp-item:hover, .sp-item.is-first { background: var(--co-hover); }
  .sp-item.is-on { background: var(--co-accent-soft); }

  @media (max-width: 960px) {
    .script-layout { grid-template-columns: minmax(0, 1fr); }
    .sc-panel { position: static; max-height: none; }
  }
  @media (max-width: 860px) {
    .script-page { padding: 24px 18px 48px; }
    .script-toolbar { top: -28px; overflow-x: auto; }
    .tb-row { flex-wrap: nowrap; }
    .tb-pop { position: fixed; top: auto; left: 12px !important; right: 12px; bottom: 12px; max-height: 50vh; width: auto !important; }
    .sc-bubble { right: 4px; }
  }
  @media print {
    #app nav[data-rail], .script-toolbar, .sc-panel, #scriptBubble, #scriptCount, [data-act="goScripts"] { display: none !important; }
    .script-layout { display: block; }
    .script-page { border: none; padding: 0; background: none; }
  }

  /* Review chrome floats over arbitrary video — often bright/blown-out footage.
     A text-shadow keeps every overlay label legible on both dark and white
     frames without darkening the video itself (unlike a heavier scrim). */
  [data-review-chrome-top], [data-review-transport], [data-notes-panel], .rv-float {
    text-shadow: 0 1px 3px rgba(0,0,0,0.65), 0 0 2px rgba(0,0,0,0.5);
  }
  /* Buttons carry their own solid fill, so drop the inherited shadow on them. */
  [data-review-stage] .m-btn { text-shadow: none; }

  /* ===== Mobile (≤ 860px) ===== */
  @media (max-width: 860px) {
    /* Rail: the vertical wordmark can't fit — collapse to a 40px strip. */
    #app nav[data-rail] { width: 40px !important; flex-basis: 40px !important; padding: 14px 0 !important; }
    #app nav[data-rail] [data-tagline] { display: none !important; }
    /* Screens: drop the design's generous 88px right gutter to 18px. */
    [data-screen] { padding: 28px 18px 40px !important; }
    [data-hide-sm] { display: none !important; }
    /* Three section tabs (Dự án · Lịch · Kịch bản) at 30px don't fit a phone. */
    [data-section-tab] { font-size: 22px !important; }
    #scriptTitle { font-size: 22px !important; }
    /* Hub/asset rows: shed the trailing metadata columns, keep title + count */
    [data-row-col="sm-hide"] { display: none !important; }
    /* Review: the right rail can't fit, so the video pins to the top of the
       stage and the notes become a bottom sheet under it instead of floating
       over it. Chrome stays visible — touch has no hover to bring it back. */
    [data-review-canvas] { place-items: start center !important; padding-top: 56px !important; }
    [data-notes-panel] { left: 0 !important; right: 0 !important; width: auto !important; top: auto !important;
      bottom: 88px !important; height: auto; max-height: 40vh; padding: 0 14px;
      opacity: 1 !important; pointer-events: auto !important; }
    [data-review-chrome-top] { padding: 0 14px !important; height: 56px !important; opacity: 1 !important; pointer-events: auto !important; }
    [data-review-transport] { padding: 0 14px 14px !important; }
    [data-transport-row] { gap: 14px 18px !important; flex-wrap: wrap !important; opacity: 1 !important; pointer-events: auto !important; }
    [data-transport-spacer] { display: none !important; }
    [data-draw-bar] { left: 0 !important; right: 0 !important; top: auto !important; bottom: 88px !important;
      max-width: none !important; flex-wrap: nowrap !important; overflow-x: auto !important;
      border-radius: 0 !important; gap: 14px !important; padding: 10px 14px !important; }
    [data-draw-bar] > * { flex: 0 0 auto; }
    [data-review-stage][data-draw-open] [data-notes-panel] { display: none !important; }
    /* Settings: nav column above content */
    [data-settings-shell] { flex-direction: column !important; }
    [data-settings-nav] { width: 100% !important; flex: 0 0 auto !important; flex-direction: row !important; gap: 16px; overflow-x: auto; padding: 18px 18px 10px !important; }
    [data-settings-nav] [data-settings-spacer] { display: none !important; }
    [data-settings-body] { padding: 18px 18px 40px !important; }
    /* Settings rows stack label over value */
    [data-settings-row] { flex-wrap: wrap !important; gap: 4px 16px !important; }
    [data-settings-row] > div:first-child { width: 100% !important; flex: 0 0 100% !important; }
    /* Overlays: full-bleed */
    [data-overlay] { padding: 56px 18px 24px !important; }
    /* Calendar: tight side padding, and chips collapse to colour dots — a
       month grid can't fit titles at 7 columns on a phone. */
    #calScroll { padding: 28px 12px 40px !important; }
    #calScroll [data-cal-day] { min-height: 84px !important; padding: 5px 3px !important; }
    .cal-chip { padding: 2px !important; gap: 0 !important; justify-content: center; }
    .cal-chip span:last-child { display: none !important; }
  }
</style>

let _renderQueued = false;
function scheduleRender() {
  if (_renderQueued) return;
  _renderQueued = true;
  requestAnimationFrame(() => {
    // If a direct render() call already ran since we scheduled, it cleared
    // _renderQueued and the DOM is up to date — nothing to do.
    if (!_renderQueued) return;
    _renderQueued = false;
    render();
  });
}

function setStateNow(patch) {

function fmtAirDate(iso) {
  const p = String(iso || "").split("-");

}
function fmtDur(ms) { const s = Math.floor(ms / 1000); const m = Math.floor(s / 60), ss = s % 60; return m + ":" + String(ss).padStart(2, "0"); }
function fmtTc(ms) {
  const fps = state.fps; let frames = Math.round((ms / 1000) * fps);
  const ff = frames % fps; let total = Math.floor(frames / fps);
  const ss = total % 60; total = Math.floor(total / 60);
  const mm = total % 60; const hh = Math.floor(total / 60);
  const p = (n) => String(n).padStart(2, "0");
  return p(hh) + ":" + p(mm) + ":" + p(ss) + ":" + p(ff);
}
function sceneAt(ms) {
  let cur = SCENES[0], idx = 0;
  for (let i = 0; i < SCENES.length; i++) { if (SCENES[i].at <= ms) { cur = SCENES[i]; idx = i; } }
  const next = SCENES[idx + 1];
  const span = (next ? next.at : state.duration) - cur.at;
  const prog = span > 0 ? Math.max(0, Math.min(1, (ms - cur.at) / span)) : 0;
  return { cur, prog };
}
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// Material 3 button helper. kind: filled | tonal | outlined | text | neutral | icon.
// Reuses the delegated data-act click path, so no per-button wiring is needed.
function mBtn(kind, o) {
  const cls = "m-btn m-btn--" + kind + (o.sm ? " m-btn--sm" : "") + (o.icon ? " m-btn--icon" : "") + (o.cls ? " " + o.cls : "");
  const attrs = [
    o.act ? `data-act="${o.act}"` : "",
    o.arg != null ? `data-arg="${esc(String(o.arg))}"` : "",
    o.stop ? `data-stop="1"` : "",
    o.disabled ? "disabled" : "",
    o.title ? `title="${esc(o.title)}"` : "",
    o.style ? `style="${o.style}"` : "",
  ].filter(Boolean).join(" ");
  return `<button class="${cls}" ${attrs}>${o.html || esc(o.label || "")}</button>`;
}

        }

    } catch (_) {}

// hls.js wrapper: native <video src=…m3u8> only works in Safari. Everywhere
// else we need hls.js attached to the element via MSE. We swap the instance
// when the src changes (e.g. user picks a different rendition rung).
let _activeHls = null;
function attachHlsIfNeeded(video) {
  if (!video) return;
  const url = video.getAttribute("src") || "";
  const isHls = /\.m3u8(\?|$)/i.test(url);
  if (!isHls) {
    if (_activeHls) { try { _activeHls.destroy(); } catch (_) {} _activeHls = null; video.removeAttribute("data-hls"); }
    return;
  }
  // Safari can play HLS natively — skip hls.js to keep things simple.
  if (video.canPlayType("application/vnd.apple.mpegurl")) return;
  if (typeof Hls === "undefined" || !Hls.isSupported()) return;
  // If hls.js is already wired to this exact URL, leave it alone.
  if (video.dataset.hls === url) return;
  if (_activeHls) { try { _activeHls.destroy(); } catch (_) {} _activeHls = null; }
  video.removeAttribute("src"); // hls.js drives the source from here on
  _activeHls = new Hls({
    // Send credentials so the API session cookie reaches /api/hls/* segment fetches.
    xhrSetup: (xhr) => { xhr.withCredentials = true; },
    enableWorker: true,
    lowLatencyMode: false,
    // Keep a healthy forward buffer (user requirement: ≥20s ahead) with a
    // 30s back-buffer cap so long sessions don't balloon memory.
    maxBufferLength: 40,
    backBufferLength: 30,
  });
  _activeHls.loadSource(url);
  _activeHls.attachMedia(video);
  video.dataset.hls = url;
  _activeHls.on(Hls.Events.ERROR, (_e, data) => {
    if (data && data.fatal) console.warn("[hls.js] fatal", data.type, data.details);
  });
}

function bindReviewVideo() {
  const video = document.getElementById("reviewVideo");
  if (!video) {
    syncPlaybackUi();
    syncPlayButtons(state.playing);
    return;
  }
  // Always re-check HLS attachment because render() rebuilds the DOM but the
  // <video> may be the same element with a new src.
  attachHlsIfNeeded(video);
  if (video.dataset.bound === "1") {
    syncPlaybackUi();
    syncPlayButtons(state.playing);
    return;
  }
  video.dataset.bound = "1";
  const updateFromVideo = () => {
    state.currentMs = Math.round((video.currentTime || 0) * 1000);
    if (Number.isFinite(video.duration) && video.duration > 0) state.duration = Math.round(video.duration * 1000);
    state.playing = !video.paused;
    syncPlaybackUi();
    requestAnnRepaint();
    syncPlayButtons(state.playing);
  };
  video.addEventListener("loadedmetadata", updateFromVideo);
  video.addEventListener("timeupdate", updateFromVideo);
  video.addEventListener("seeked", updateFromVideo);
  video.addEventListener("play", updateFromVideo);
  video.addEventListener("pause", updateFromVideo);
  video.addEventListener("ended", updateFromVideo);
  video.addEventListener("ended", () => { state._playIntent = false; });
  // Auto-resume: if the user wants playback (_playIntent) but the element is
  // paused (buffer stall, or the element was recreated on a src change), start
  // again once ≥20s — or everything up to the end — is buffered ahead.
  const bufferedAheadSec = () => {
    try {
      const t = video.currentTime || 0;
      for (let i = 0; i < video.buffered.length; i++) {
        if (video.buffered.start(i) <= t + 0.1 && video.buffered.end(i) > t) return video.buffered.end(i) - t;
      }
    } catch (_) {}
    return 0;
  };
  const tryResume = (force) => {
    if (!state._playIntent || !video.paused) return;
    if (force !== true) {
      const remaining = (Number.isFinite(video.duration) ? video.duration : Infinity) - (video.currentTime || 0);
      if (bufferedAheadSec() < Math.min(20, Math.max(0.5, remaining - 0.25))) return;
    }
    video.play().catch(() => {});
  };
  video.addEventListener("progress", () => tryResume(false));
  // canplaythrough = the browser itself estimates uninterrupted playback is
  // possible — resume without the 20s threshold (covers unknown-duration media).
  video.addEventListener("canplaythrough", () => tryResume(true));
  if (state.currentMs > 0) {
    try { video.currentTime = state.currentMs / 1000; } catch (_) {}
  }
  updateFromVideo();
}

async function saveSettingsChanges() {
  const dirty = state.settingsDirty || {};

  const patch = {};
  for (const [k, v] of Object.entries(dirty)) {
    const parts = k.split(".");

      cur = cur[parts[i]];
    }

  }

// ---- speed ----
async function measureSpeedMbps() {
  // Throughput test designed for gigabit-class NAS (target: ±5% accuracy at 1 Gbps).
  //
  // Why the simpler "sequential single fetch" doesn't work at 1 Gbps:
  //   - A 1 GbE link delivers ~118 MB/s steady-state. An 8 MB segment finishes
  //     in ~70 ms, of which ~30-50 ms is TCP slow-start + HTTP overhead, so
  //     the measured throughput reads ~50% of true bandwidth.
  //   - Single-stream HTTP over Caddy + Tailscale rarely saturates the link;
  //     parallel connections are needed to fill the pipe.
  //
  // Method:
  //   1. WARMUP — open N parallel streams, pull a small payload to grow TCP
  //      congestion windows + warm Caddy's reverse-proxy connection pool.
  //   2. MEASURE — open N parallel streams pulling LARGE payloads in parallel.
  //      Time the wall clock from "all started" to "all finished", compute
  //      throughput = totalBytes * 8 / elapsedSec.
  //   3. Repeat MEASURE for ~12-15 s of steady-state samples, then trim the
  //      slowest 30% (warmup tail + GC blips) and average the rest.
  if (!API_BASE || !remote.me) return null;
  const PARALLEL = 4;                   // 4 streams typically saturate gigabit through 1 reverse proxy
  const PER_STREAM_MB = 32;             // 32 MiB × 4 = 128 MiB per round, ~1 s at 1 Gbps
  const ROUND_SIZE = PER_STREAM_MB * 1024 * 1024;
  const TOTAL_BUDGET_MS = 15_000;       // overall wall-clock budget
  const WARMUP_BUDGET_MS = 1_500;

  async function fetchAndDrain(size) {
    const res = await fetch(API_BASE + "/speedtest/segment?size=" + size + "&ts=" + Date.now() + "-" + Math.random(), {
      credentials: "include",
      cache: "no-store",
    });
    if (!res.ok) throw new Error("speedtest_failed_" + res.status);
    // Stream-read so the browser doesn't buffer the whole response in memory
    // (32 MiB × 4 = 128 MiB peak otherwise). reader.read() yields chunks as
    // the network delivers them, and we just discard.
    const reader = res.body && res.body.getReader ? res.body.getReader() : null;
    if (reader) {
      let bytes = 0;
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        bytes += value ? value.byteLength : 0;
      }
      return bytes;
    }
    const buf = await res.arrayBuffer();
    return buf.byteLength;
  }

  // ---- 1. Warmup ----
  const warmupStart = performance.now();
  while (performance.now() - warmupStart < WARMUP_BUDGET_MS) {
    try {
      await Promise.all(Array.from({ length: PARALLEL }, () => fetchAndDrain(1024 * 1024)));
    } catch (e) { return null; }
  }

  // ---- 2. Measurement rounds ----
  const samplesMbps = [];
  const startMeasure = performance.now();
  while (performance.now() - startMeasure < TOTAL_BUDGET_MS - WARMUP_BUDGET_MS) {
    const t0 = performance.now();
    let bytesTotal = 0;
    try {
      const results = await Promise.all(Array.from({ length: PARALLEL }, () => fetchAndDrain(ROUND_SIZE)));
      bytesTotal = results.reduce((a, b) => a + b, 0);
    } catch (e) { break; }
    const elapsedSec = (performance.now() - t0) / 1000;
    if (elapsedSec <= 0 || bytesTotal <= 0) continue;
    const mbps = (bytesTotal * 8) / elapsedSec / 1_000_000;
    samplesMbps.push(mbps);
    // Show rolling reading while the test progresses (smoother UI than per-sample jitter).
    const recent = samplesMbps.slice(-3);
    const avg = recent.reduce((a, b) => a + b, 0) / recent.length;
    state.speedDisplay = Math.max(1, Math.round(avg));
    render();
  }
  if (!samplesMbps.length) return null;
  // Trim slowest 30% to remove warmup tail / GC blips, then average.
  const sorted = samplesMbps.slice().sort((a, b) => a - b);
  const trimmed = sorted.slice(Math.floor(sorted.length * 0.3));
  const final = trimmed.reduce((a, b) => a + b, 0) / trimmed.length;
  return Math.max(1, Math.round(final));
}

// Format Mbps for display: ≥1000 → "1.2 Gbps", else "240 Mbps".
function formatSpeedValue(mbps) {
  if (mbps >= 1000) return { value: (mbps / 1000).toFixed(mbps >= 10000 ? 0 : 1), unit: "Gbps" };
  return { value: String(Math.round(mbps)), unit: "Mbps" };
}
async function runSpeedTest() {
  if (state.speedTesting) return;
  state.speedTesting = true;
  clearInterval(speedTimer);
  speedTimer = null;
  render();
  let final = null;
  try {
    final = await measureSpeedMbps();
  } catch (_) {}
  state.speedTesting = false;
  if (final != null) {
    state.speedMbps = final;
    state.speedDisplay = final;
    if (state.autoQualityEnabled) applyAutoQualityRecommendation(final);
  }
  render();
}

// Original file as an attachment — the API sets Content-Disposition, so the
// browser downloads in place without leaving the page (works cross-origin too).
// A 1-byte probe goes first: if the file is gone from the NAS, the anchor would
// otherwise navigate the whole app to the API's JSON error page.
async function downloadSource(assetId) {
  const url = apiMediaUrl("/assets/" + encodeURIComponent(assetId) + "/source");
  const probe = await fetch(url, { credentials: "include", headers: { Range: "bytes=0-0" } }).catch(() => null);
  if (!probe || !probe.ok) {
    const title = (Object.values(state.sourcesByProject).flat().find((s) => s.id === assetId) || {}).title || "video";
    return toast("Không tải được \"" + title + "\" — không tìm thấy file gốc trên NAS", "error");
  }
  const a = document.createElement("a");
  a.href = url + "?download=1";
  a.rel = "noopener";
  document.body.appendChild(a); a.click(); a.remove();
}

// Whole project as one STORE-mode ZIP streamed by the API (no temp file on the
// NAS). Asks first so missing files / the concurrency cap surface as a toast
// rather than the browser navigating to the API's JSON error.
async function downloadAllSources(projectId) {
  const url = apiMediaUrl("/projects/" + encodeURIComponent(projectId) + "/download.zip");
  let info;
  try { info = await api("/projects/" + encodeURIComponent(projectId) + "/download.zip?check=1"); }
  catch (e) { return toast((e && e.message) || "Không tải được dự án", "error"); }
  if (!info.files) return toast("Không có file gốc nào của dự án trên NAS", "error");
  if (info.busy) return toast("Đang có quá nhiều lượt tải ZIP, thử lại sau ít phút", "error");
  const a = document.createElement("a");
  a.href = url; a.rel = "noopener";
  document.body.appendChild(a); a.click(); a.remove();
  const skipped = (info.missing || []).length;
  toast("Đang tải ZIP " + info.files + " video · " + fmtBytes(info.bytes) + (skipped ? " — bỏ qua " + skipped + " video không còn trên NAS" : ""), skipped ? "error" : undefined);
}

function computeProxyCacheSummary(storage) {
  if (!storage) return null;
  const totalBytes = Number(storage.totalBytes || 0);
  const totalGb = totalBytes / (1024 ** 3);
  const softCapacityGb = 100;
  const pct = totalGb <= 0 ? 0 : Math.max(4, Math.min(100, Math.round((totalGb / softCapacityGb) * 100)));
  const renditionCount = Number(storage.renditionCount || (Array.isArray(storage.renditions) ? storage.renditions.length : 0));
  const orphanCount = Number(storage.orphanCount || 0);
  const totalLabel = fmtBytes(totalBytes);
  const countLabel = renditionCount ? (renditionCount + " proxy đã lưu") : "Chưa có proxy nào";
  const usageLabel = totalBytes > 0 ? (pct + "% ngưỡng cache SSD") : "0% ngưỡng cache SSD";
  const detailParts = [];
  if (orphanCount) detailParts.push(orphanCount + " orphan");
  if (storage.backend) detailParts.push("lưu trên " + storage.backend);
  if (storage.stale) detailParts.push("snapshot gần nhất");
  if (storage.note) detailParts.push(storage.note);
  return {
    totalBytes,
    pct,
    totalLabel,
    countLabel,
    usageLabel,
    detailLabel: detailParts.join(" · ") || "Nhấn để mở trang quản lý proxy",
    label: fmtBytes(totalBytes)
      + (renditionCount ? (" · " + renditionCount + " proxy") : " · chưa có proxy")
      + (orphanCount ? (" · " + orphanCount + " orphan") : ""),
    savedAt: storage.savedAt || new Date().toISOString(),
  };
}

function hydrateProxyCache(cache, { loading = false, error = "" } = {}) {
  if (!cache) return null;
  const totalBytes = Number(cache.totalBytes || 0);
  const renditionCount = Number(cache.renditionCount || 0);
  const orphanCount = Number(cache.orphanCount || 0);
  const totalLabel = cache.totalLabel || fmtBytes(totalBytes);
  const countLabel = cache.countLabel
    || (renditionCount ? (renditionCount + " proxy đã lưu") : "Chưa có proxy nào");
  const usageLabel = cache.usageLabel || (totalBytes > 0 ? ((cache.pct || 0) + "% ngưỡng cache SSD") : "0% ngưỡng cache SSD");
  let detailLabel = cache.detailLabel || "";
  if (error) {
    detailLabel = totalBytes > 0
      ? ("Chưa làm mới được số liệu · đang hiển thị cache gần nhất")
      : "Mở trang quản lý để xem lỗi chi tiết";
  } else if (loading) {
    detailLabel = totalBytes > 0
      ? "Đang làm mới dung lượng proxy từ MinIO…"
      : "Đang đồng bộ dung lượng từ MinIO…";
  } else if (!detailLabel) {
    const detailParts = [];
    if (orphanCount) detailParts.push(orphanCount + " orphan");
    if (cache.backend) detailParts.push("lưu trên " + cache.backend);
    if (cache.stale) detailParts.push("snapshot gần nhất");
    if (cache.savedAt) detailParts.push("cập nhật " + fmtAgo(cache.savedAt));
    if (cache.note) detailParts.push(cache.note);
    detailLabel = detailParts.join(" · ") || "Nhấn để mở trang quản lý proxy";
  }

function computeTimelineMarkerLanes(items, timelineWidthPx = 0) {
  const safeWidth = Math.max(280, Number(timelineWidthPx || 0));
  const minGapPx = Math.max(24, Math.min(42, Math.round(safeWidth * 0.032)));
  const edgePaddingPx = 12;
  const avatarHalfPx = 14;
  const annotationBadgeOverflowPx = 8;
  const laneEnds = [];
  const hasAnnotationBadge = (items || []).some((item) => !!(item && item.hasAnnotation));
  const markers = [...items]
    .map((item, index) => {
      const rawLeftPx = (Number(item.leftPct || 0) / 100) * safeWidth;
      const leftPx = Math.max(edgePaddingPx, Math.min(safeWidth - edgePaddingPx, rawLeftPx));
      const nearLeftEdge = leftPx <= (edgePaddingPx + avatarHalfPx);
      const nearRightEdge = leftPx >= (safeWidth - edgePaddingPx - avatarHalfPx);
      return {
        ...item,
        _index: index,
        leftPx,
        leftPct: safeWidth > 0 ? (leftPx / safeWidth) * 100 : 0,
        markerTransform: nearLeftEdge ? "translateX(0)" : (nearRightEdge ? "translateX(-100%)" : "translateX(-50%)"),
      };
    })
    .sort((a, b) => {
      if (Math.abs(a.leftPx - b.leftPx) > 0.5) return a.leftPx - b.leftPx;
      if (!!b.hasAnnotation !== !!a.hasAnnotation) return Number(!!b.hasAnnotation) - Number(!!a.hasAnnotation);
      if ((b.count || 1) !== (a.count || 1)) return (b.count || 1) - (a.count || 1);
      return a._index - b._index;
    })
    .map((item) => {
      let lane = 0;
      while (lane < laneEnds.length && item.leftPx - laneEnds[lane] < minGapPx) lane++;
      laneEnds[lane] = item.leftPx;
      return { ...item, lane, topPx: lane * 22, zIndex: 20 - Math.min(19, lane) };
    })
    .sort((a, b) => a._index - b._index)
    .map(({ _index, leftPx, ...item }) => item);
  const laneCount = Math.max(1, laneEnds.length);
  const reservedBottomPx = hasAnnotationBadge ? annotationBadgeOverflowPx : 2;
  // Each lane is a 22px round avatar. Reserve a little extra vertical room
  // when the annotation badge is present so the badge never sits on top of the
  // timeline bar or seek needle.
  return {
    items: markers,
    laneCount,
    railHeight: 22 + Math.max(0, laneCount - 1) * 22 + reservedBottomPx,
    paddingTop: 22 + Math.max(0, laneCount - 1) * 22 + reservedBottomPx,
  };
}

function buildTimelineMarkers(comments, durationMs, fps, timelineWidthPx) {
  const duration = Math.max(1, Number(durationMs || 0));
  const frameBucketMs = Math.max(1, Math.round(1000 / Math.max(1, Number(fps || 25))));
  const grouped = new Map();
  for (const comment of comments || []) {
    if (!comment) continue;
    const bucket = Math.round(Number(comment.ms || 0) / frameBucketMs);
    const authorKey = String(comment.authorKey || comment.name || comment.initial || "user");
    const key = authorKey + "::" + bucket;
    if (!grouped.has(key)) {
      grouped.set(key, {
        ms: Number(comment.ms || 0),
        leftPct: (Number(comment.ms || 0) / duration) * 100,
        color: comment.color,
        initial: comment.initial || "U",
        hasAnnotation: !!comment.hasAnnotation,
        avatarBg: comment.color || "#7c92ff",
        avatarBorder: comment.hasAnnotation ? "#d9a45b" : "var(--co-chrome)",
        avatarColor: "#07090e",
        markerBg: comment.resolved ? "var(--co-panel-2)" : (comment.color || "#7c92ff"),
        markerDot: comment.resolved ? (comment.color || "#7c92ff") : "#07090e",
        tip: (comment.name || "User") + " · " + comment.tcLabel + (comment.hasAnnotation ? " · có chú thích" : ""),
        count: 1,
        annotationCount: comment.hasAnnotation ? 1 : 0,
        commentCount: 1,
        resolvedCount: comment.resolved ? 1 : 0,
      });
      continue;
    }
    const existing = grouped.get(key);
    existing.ms = Math.min(existing.ms, Number(comment.ms || 0));
    existing.leftPct = (existing.ms / duration) * 100;
    existing.hasAnnotation = existing.hasAnnotation || !!comment.hasAnnotation;
    existing.avatarBorder = existing.hasAnnotation ? "#d9a45b" : "var(--co-chrome)";
    existing.count += 1;
    existing.commentCount += 1;
    existing.annotationCount += comment.hasAnnotation ? 1 : 0;
    existing.resolvedCount += comment.resolved ? 1 : 0;
    existing.markerBg = existing.resolvedCount >= existing.count ? "var(--co-panel-2)" : existing.color;
    existing.markerDot = existing.resolvedCount >= existing.count ? existing.color : "#07090e";
    existing.tip = (comment.name || "User") + " · " + comment.tcLabel
      + (existing.count > 1 ? (" · " + existing.count + " bình luận") : "")
      + (existing.annotationCount ? (" · " + existing.annotationCount + " chú thích") : "");
  }
  return computeTimelineMarkerLanes([...grouped.values()], timelineWidthPx);
}

const timelineMarkerMemo = {
  signature: "",
  durationMs: 0,
  fps: 0,
  timelineWidthPx: 0,
  layout: { items: [], laneCount: 1, railHeight: 24, paddingTop: 24 },
};

function markerCommentSignature(comments) {
  return (comments || []).map((comment) => {
    const annotation = comment && comment.annotation ? comment.annotation : null;
    const strokeCount = annotation && annotation.strokes ? annotation.strokes.length : 0;
    const textCount = annotation && annotation.texts ? annotation.texts.length : 0;
    return [
      comment && comment.id || "",
      comment && comment.authorKey || "",
      Math.round(Number(comment && comment.ms || 0)),
      comment && comment.resolved ? 1 : 0,
      strokeCount,
      textCount,
      (comment && comment.replies ? comment.replies.length : 0),
    ].join(":");
  }).join("|");
}

function getTimelineMarkerLayout(comments, durationMs, fps, timelineWidthPx) {
  const signature = markerCommentSignature(comments);
  const width = Math.round(Number(timelineWidthPx || 0));
  const duration = Math.round(Number(durationMs || 0));
  const nextFps = Math.round(Number(fps || 0));
  if (
    timelineMarkerMemo.signature === signature
    && timelineMarkerMemo.durationMs === duration
    && timelineMarkerMemo.fps === nextFps
    && timelineMarkerMemo.timelineWidthPx === width
  ) {
    return timelineMarkerMemo.layout;
  }
  const layout = buildTimelineMarkers(flattenTimedComments(comments), durationMs, fps, timelineWidthPx);
  timelineMarkerMemo.signature = signature;
  timelineMarkerMemo.durationMs = duration;
  timelineMarkerMemo.fps = nextFps;
  timelineMarkerMemo.timelineWidthPx = width;
  timelineMarkerMemo.layout = layout;
  return layout;
}

async function setProjectAirDate(projectId, airDate) {
  const value = airDate || null;

  if (!window.confirm("Xoá kịch bản \"" + s.title + "\"? Không thể hoàn tác.")) return;
  try {
    await api("/scripts/" + encodeURIComponent(s.id), { method: "DELETE" });
    clearTimeout(_scriptSaveTimer);
    _scriptDirty = false;
    state.scripts = (state.scripts || []).filter((x) => x.id !== s.id);
    state.script = null; state.scriptSave = "saved";
    goScripts();
  } catch (e) { toast((e && e.message) || "Không xoá được kịch bản", "error"); }
}

function scriptCmd(arg) {
  const ed = scriptEd;
  if (!ed || !arg) return;
  const c = () => ed.chain().focus();
  const [k, v] = arg.includes(":") ? [arg.slice(0, arg.indexOf(":")), arg.slice(arg.indexOf(":") + 1)] : [arg, null];
  const size = parseInt(ed.getAttributes("textStyle").fontSize, 10) || SCRIPT_BASE_SIZE;
  const step = (dir) => {
    const next = dir > 0 ? SCRIPT_SIZES.find((n) => n > size) : [...SCRIPT_SIZES].reverse().find((n) => n < size);
    if (next) c().setFontSize(next + "px").run();
  };
  let closeMenu = true;
  switch (k) {
    case "undo": c().undo().run(); break;
    case "redo": c().redo().run(); break;
    case "p": c().setParagraph().run(); break;
    case "h1": case "h2": case "h3": c().toggleHeading({ level: Number(k[1]) }).run(); break;
    case "font": v ? c().setFontFamily(v).run() : c().unsetFontFamily().run(); break;
    case "size": Number(v) === SCRIPT_BASE_SIZE ? c().unsetFontSize().run() : c().setFontSize(v + "px").run(); break;
    case "size-dec": step(-1); closeMenu = false; break;
    case "size-inc": step(1); closeMenu = false; break;
    case "bold": c().toggleBold().run(); break;
    case "italic": c().toggleItalic().run(); break;
    case "underline": c().toggleUnderline().run(); break;
    case "strike": c().toggleStrike().run(); break;
    case "sup": c().toggleSuperscript().run(); break;
    case "sub": c().toggleSubscript().run(); break;
    case "color": v ? c().setColor(v).run() : c().unsetColor().run(); break;
    case "hl": v ? c().setHighlight({ color: v }).run() : c().unsetHighlight().run(); break;
    case "align": c().setTextAlign(v).run(); break;
    case "ul": c().toggleBulletList().run(); break;
    case "ol": c().toggleOrderedList().run(); break;
    case "task": c().toggleTaskList().run(); break;
    case "indent": c().sinkListItem(ed.isActive("taskItem") ? "taskItem" : "listItem").run(); break;
    case "outdent": c().liftListItem(ed.isActive("taskItem") ? "taskItem" : "listItem").run(); break;
    case "quote": c().toggleBlockquote().run(); break;
    case "hr": c().setHorizontalRule().run(); break;
    case "clear": c().unsetAllMarks().clearNodes().run(); break;
    case "table": { const [r, cols] = v.split("x").map(Number); c().insertTable({ rows: r, cols, withHeaderRow: true }).run(); break; }
    case "tbl-row-before": c().addRowBefore().run(); break;
    case "tbl-row-after": c().addRowAfter().run(); break;
    case "tbl-col-before": c().addColumnBefore().run(); break;
    case "tbl-col-after": c().addColumnAfter().run(); break;
    case "tbl-del-row": c().deleteRow().run(); break;
    case "tbl-del-col": c().deleteColumn().run(); break;
    case "tbl-merge": c().mergeOrSplit().run(); break;
    case "tbl-header": c().toggleHeaderRow().run(); break;
    case "tbl-delete": c().deleteTable().run(); break;
    case "link-apply": {
      const input = document.getElementById("scriptLinkInput");
      let href = ((input && input.value) || "").trim();
      if (!href) { c().extendMarkRange("link").unsetLink().run(); break; }
      if (!/^[a-z][a-z0-9+.-]*:/i.test(href)) href = "https://" + href;
      if (!/^(https?|mailto|tel):/i.test(href)) { toast("Chỉ hỗ trợ liên kết http(s), mailto, tel", "error"); closeMenu = false; break; }
      if (ed.state.selection.empty && !ed.isActive("link")) c().insertContent({ type: "text", text: href, marks: [{ type: "link", attrs: { href } }] }).run();
      else c().extendMarkRange("link").setLink({ href }).run();
      break;
    }
    case "unlink": c().extendMarkRange("link").unsetLink().run(); break;
    case "comment": state.scriptMenu = null; return startScriptComment();
  }
  if (closeMenu && state.scriptMenu) state.scriptMenu = null;
  paintScriptChrome();
}

    setStateNow({ scriptReplyText: "" });
    const i = document.getElementById("scriptReplyInput"); if (i) i.value = "";
  } catch (e) { toast((e && e.message) || "Không gửi được trả lời", "error"); }
}
async function resolveScriptThread(id, resolved) {
  const s = state.script; if (!s) return;
  try {
    const c = await api("/script-comments/" + encodeURIComponent(id), { method: "PATCH", body: { resolved } });
    s.comments = s.comments.map((x) => (x.id === id ? c : x));
    bumpScriptRowComments(s.id, resolved ? -1 : 1);
    setStateNow({ scriptActiveThread: resolved ? null : id, scriptThreadFilter: resolved ? state.scriptThreadFilter : "open" });
    if (resolved) toast("Đã giải quyết bình luận");
  } catch (e) { toast((e && e.message) || "Không cập nhật được bình luận", "error"); }
}
async function saveScriptCommentEdit() {
  const s = state.script, id = state.scriptEditComment;
  const content = (state.scriptEditCommentText || "").trim();
  if (!s || !id || !content) return;
  try {
    const c = await api("/script-comments/" + encodeURIComponent(id), { method: "PATCH", body: { content } });
    s.comments = s.comments.map((x) => (x.id === id ? c : x));
    setStateNow({ scriptEditComment: null, scriptEditCommentText: "" });
  } catch (e) { toast((e && e.message) || "Không sửa được bình luận", "error"); }
}
async function deleteScriptComment(id) {
  const s = state.script; if (!s) return;
  const target = (s.comments || []).find((c) => c.id === id);
  if (!target) return;
  if (!target.parentId && !window.confirm("Xoá cả luồng bình luận này (kèm các trả lời)?")) return;
  try {
    await api("/script-comments/" + encodeURIComponent(id), { method: "DELETE" });
    s.comments = s.comments.filter((c) => c.id !== id && c.parentId !== id);
    if (!target.parentId) {
      if (!target.resolved) bumpScriptRowComments(s.id, -1);
      removeScriptCommentMark(id);
    }
    setStateNow({ scriptActiveThread: state.scriptActiveThread === id ? null : state.scriptActiveThread });
  } catch (e) { toast((e && e.message) || "Không xoá được bình luận", "error"); }
}
// Strip one thread's anchor from the body (other overlapping threads stay).
function removeScriptCommentMark(id) {
  if (!scriptEd) return;
  const { tr, doc } = scriptEd.state;
  doc.descendants((node, pos) => {
    for (const m of node.marks || []) if (m.type.name === "comment" && m.attrs.id === id) tr.removeMark(pos, pos + node.nodeSize, m);
  });
  if (tr.docChanged) scriptEd.view.dispatch(tr);
}
function bumpScriptRowComments(scriptId, delta) {
  const row = (state.scripts || []).find((x) => x.id === scriptId);
  if (row) row.commentCount = Math.max(0, (row.commentCount || 0) + delta);
}
function focusScriptThread(id) {
  setStateNow({ scriptActiveThread: id, scriptReplyText: "", scriptEditComment: null });
  const el = document.querySelector('#scriptEditorMount [data-comment-id="' + CSS.escape(id) + '"]');
  if (el) el.scrollIntoView({ block: "center", behavior: "smooth" });
  const i = document.getElementById("scriptReplyInput"); if (i) i.focus({ preventScroll: true });
}

// ---- project link picker ----
// Projects share one default palette, so tint by id instead: a stable colour
// + initial per project makes the picker scannable at a glance.
const PROJECT_TINTS = ["#9184d9", "#2da8e2", "#e072a8", "#f5a623", "#35c389", "#e5604d", "#5b8def", "#b07be0", "#26a69a", "#d4a017"];
function projectTile(p, size) {
  let h = 0;
  for (const ch of String(p.id)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  const c = PROJECT_TINTS[h % PROJECT_TINTS.length];
  const initial = String(p.name || "?").replace(/^[^\p{L}\p{N}]+/u, "").charAt(0).toUpperCase() || "?";
  return `<span style="width:${size}px;height:${size}px;flex:0 0 ${size}px;border-radius:${Math.round(size / 3.2)}px;display:grid;place-items:center;font-size:${Math.round(size * 0.48)}px;font-weight:650;color:${c};background:color-mix(in srgb, ${c} 18%, transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb, ${c} 38%, transparent);">${esc(initial)}</span>`;
}
function scriptProjectPicker(s) {
  const linked = s.projectId ? PROJECTS.find((p) => p.id === s.projectId) : null;
  const swatch = (p, size) => projectTile(p, size);

    ? `<div data-act="toggleScriptProjMenu" class="sp-chip${state.scriptProjMenu ? " is-on" : ""}" title="Dự án của kịch bản">${swatch(linked, 20)}<span style="max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(linked.name)}</span><span style="opacity:.6;display:flex;">${sIcon("chevron", 14)}</span></div>`

  if (!state.scriptProjMenu) return `<div data-script-proj style="position:relative;">${chip}</div>`;
  const q = (state.scriptProjQuery || "").trim().toLowerCase();

// Custom date-picker popover — a Nocturne-styled month grid, used to set a
// project's air date (the native <input type="date"> looked out of place).
function datePickerPopover() {
  const pid = state.datePickerFor;
  if (!pid) return "";
  const p = PROJECTS.find((x) => x.id === pid);
  const selected = (p && p.airDate) || "";
  const y = state.datePickerY, m = state.datePickerM;
  const { start } = calGridRange(y, m);
  const todayIso = calIsoDay(new Date());
  const weekdays = ["T2", "T3", "T4", "T5", "T6", "T7", "CN"];
  const cells = [];
  for (let i = 0; i < 42; i++) { const d = new Date(start); d.setDate(start.getDate() + i); cells.push(d); }
  const pos = state.datePickerPos || { x: 200, y: 160 };
  return `
  <div data-act="closeDatePicker" style="position:fixed;inset:0;z-index:95;">
    <div data-stop="1" style="position:fixed;left:${pos.x}px;top:${pos.y}px;width:286px;background:var(--co-menu);border:1px solid var(--co-border-2);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,0.5);padding:14px;z-index:96;animation:coFade 140ms ease;">
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:12px;">
        <div style="flex:1;font-size:14px;font-weight:600;">Tháng ${m}, ${y}</div>
        <div data-act="dpPrev" class="co-act co-hover" title="Tháng trước" style="width:26px;height:26px;display:grid;place-items:center;border-radius:8px;cursor:pointer;color:var(--co-muted);font-size:15px;">‹</div>
        <div data-act="dpNext" class="co-act co-hover" title="Tháng sau" style="width:26px;height:26px;display:grid;place-items:center;border-radius:8px;cursor:pointer;color:var(--co-muted);font-size:15px;">›</div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;">
        ${weekdays.map((w) => `<div style="font-size:10.5px;font-weight:500;color:var(--co-faint);text-align:center;padding-bottom:6px;">${w}</div>`).join("")}
        ${cells.map((d) => {
          const iso = calIsoDay(d);
          const inMonth = (d.getMonth() + 1) === m;
          const isToday = iso === todayIso;
          const sel = iso === selected;
          const style = sel
            ? "background:var(--co-accent);color:var(--co-on-accent);font-weight:600;"
            : isToday ? "box-shadow:inset 0 0 0 1px var(--co-accent-line);color:var(--co-text);"
            : inMonth ? "color:var(--co-text-2);" : "color:var(--co-faint);";
          return `<div data-act="dpPick" data-arg="${iso}" class="dp-day" style="height:34px;display:grid;place-items:center;border-radius:8px;font-size:13px;cursor:pointer;${style}">${d.getDate()}</div>`;
        }).join("")}

        <div data-act="dpClear" class="co-act" style="font-size:12.5px;color:${selected ? "var(--co-bad)" : "var(--co-faint)"};cursor:pointer;">Xoá ngày</div>

}

// Safe-area overlay — supports horizontal (16:9 review masters), vertical
// short/reel (9:16), and square (1:1). For 9:16 and 1:1 the container is
// 16:9 so we draw a centered crop rectangle of the target ratio plus the
// usual inner safe margins (5% title-safe, 10% action-safe) inside that crop.
function safeAreaOverlay(aspect) {
  if (!aspect || aspect === "off") return "";
  if (aspect === "16:9") {
    return `
      <div style="position:absolute;inset:10%;border:1px solid rgba(255,255,255,0.4);pointer-events:none;"></div>
      <div style="position:absolute;inset:5%;border:1px solid rgba(255,255,255,0.2);pointer-events:none;"></div>
      <div style="position:absolute;left:8px;bottom:calc(7.5% + 4px);background:rgba(0,0,0,0.55);color:rgba(255,255,255,0.55);font-weight:500;font-size:10.5px;letter-spacing:0.1em;padding:3px 7px;border-radius:5px;pointer-events:none;">SAFE 16:9</div>`;
  }
  // For 9:16 inside a 16:9 frame, target width = container height * (9/16).
  // For 1:1, target width = container height.
  // We use aspect-ratio CSS on a centered child so the math stays correct
  // regardless of player width.
  const ratio = aspect === "9:16" ? "9 / 16" : "1 / 1";
  const label = aspect === "9:16" ? "SAFE 9:16 (short / reel)" : "SAFE 1:1 (square)";
  return `
    <div style="position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;">
      <div style="height:100%;aspect-ratio:${ratio};position:relative;outline:1.5px solid rgba(145,132,217,0.7);background:rgba(0,0,0,0.18);">
        <div style="position:absolute;inset:6%;border:1px solid rgba(255,255,255,0.4);"></div>
        <div style="position:absolute;inset:3%;border:1px solid rgba(255,255,255,0.2);"></div>
        <div style="position:absolute;left:6px;top:6px;background:rgba(145,132,217,0.85);color:#0d0e18;font-weight:500;font-size:10.5px;letter-spacing:0.1em;padding:3px 7px;border-radius:5px;">${label}</div>
      </div>
    </div>`;
}

// The SVG is viewBox="0 0 1 1" with preserveAspectRatio="none", so its
// coordinate system is stretched 16:9 — strokes survive that via
// vector-effect, but glyphs came out horizontally squashed. Real DOM boxes
// keep their aspect, wrap text for free, and resize without distortion.
// Geometry is normalised 0..1 against the frame, same as strokes, so the
// stored payload stays resolution-independent.
// ---------------------------------------------------------------------------
const ANN_TEXT_SCALE = { 2: 1.2, 4: 1.6, 7: 2.2 };   // stroke-width control doubles as text size

function annTextsInteractive() {

function renderTextBox(t, readOnly) {

    + `box-sizing:border-box;padding:0.6cqw 0.9cqw;border-radius:0.6cqw;background:rgba(7,9,14,0.72);`
    + `border:1px solid ${editing || selected ? "#9184d9" : color};`

    + `white-space:pre-wrap;overflow-wrap:anywhere;`

    // Coalesced events carry the full-rate pointer trail between frames —
    // without them fast strokes get corner-cut on 60Hz event delivery.
    const evs = (typeof ev.getCoalescedEvents === "function" && ev.getCoalescedEvents().length) ? ev.getCoalescedEvents() : [ev];
    for (const e of evs) {
      const [px, py] = norm(e);
      const last = d.points[d.points.length - 1];
      if (Math.hypot(px - last[0], py - last[1]) < 0.002) continue;
      d.points.push([px, py]);
    }
    requestAnnRepaint(true);
    return;
  }

  // phase === "up"
  const dUp = state.annotationDrawing;
  if (dUp && dUp.tool !== "pen" && dUp.tool !== "highlight" && dUp.points.length >= 1) dUp.points[1] = [x, y];
  if (_annDrag) {
    const wasMove = !!_annDrag.id;
    _annDrag = null;
    if (wasMove) render();
    else render(); // eraser: refresh the counter
    return;
  }
  const d = state.annotationDrawing;
  if (!d) return;
  state.annotationDrawing = null;
  if (d.tool === "text") {
    const a = d.points[0], b = d.points[1] || d.points[0];
    let x0 = Math.min(a[0], b[0]), y0 = Math.min(a[1], b[1]);
    let w = Math.abs(b[0] - a[0]), h = Math.abs(b[1] - a[1]);
    if (w < ANN_TEXT_MIN_W || h < ANN_TEXT_MIN_H) { w = 0.28; h = 0.09; }  // plain click
    x0 = Math.max(0, Math.min(1 - w, x0)); y0 = Math.max(0, Math.min(1 - h, y0));
    annPushUndo();
    const box = { id: d.id, x: x0, y: y0, w, h, color: d.color, size: d.width, text: "" };
    state.annotationTexts = [...(state.annotationTexts || []), box].slice(-30);
    state.annotationSelId = box.id;
    state.annotationEditId = box.id;
    render();
    const ta = document.getElementById("annTextEdit");
    if (ta) ta.focus();
    return;
  }
  // Discard accidental taps: a shape needs a real drag, a pen needs 2+ points.
  const tiny = d.points.length < 2
    || (d.tool !== "pen" && d.tool !== "highlight" && Math.hypot(d.points[1][0] - d.points[0][0], d.points[1][1] - d.points[0][1]) < 0.01);
  if (tiny) { requestAnnRepaint(false); return; }
  // Thin long strokes on commit (keeps payload bounded) instead of dropping
  // the stroke's beginning mid-draw like the old 256-point live cap did.
  while (d.points.length > 400) d.points = d.points.filter((_, i) => i % 2 === 0 || i === d.points.length - 1);
  annPushUndo();
  state.annotationStrokes = [...(state.annotationStrokes || []), d];
  if (state.annotationStrokes.length > 50) state.annotationStrokes = state.annotationStrokes.slice(-50);
  // Full render only on commit so the toolbar's counter updates.
  render();
};

function annEraseAt(x, y) {
  const hit = annHit(x, y);
  if (!hit) return;
  annRemoveObject(hit.id);
  if (state.annotationSelId === hit.id) state.annotationSelId = null;
  requestAnnRepaint(false);
}

function fmtBytes(n) {
  if (!n) return "0 B";
  const units = ["B", "KB", "MB", "GB", "TB"];
  let i = 0; let v = n;
  while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
  return v.toFixed(v < 10 && i > 0 ? 1 : 0) + " " + units[i];
}

function fmtAgo(iso) {
  const ms = Date.parse(String(iso || ""));
  if (!Number.isFinite(ms)) return "không rõ";
  const diffSec = Math.max(0, Math.round((Date.now() - ms) / 1000));
  if (diffSec < 60) return "vừa xong";
  const diffMin = Math.round(diffSec / 60);
  if (diffMin < 60) return diffMin + " phút trước";
  const diffHour = Math.round(diffMin / 60);
  if (diffHour < 24) return diffHour + " giờ trước";
  const diffDay = Math.round(diffHour / 24);
  return diffDay + " ngày trước";
}

        <div id="reviewTcCurrent" class="rv-float" style="position:absolute;left:26px;top:80px;font-variant-numeric:tabular-nums;font-size:12.5px;font-weight:600;color:rgba(255,255,255,0.9);pointer-events:none;">${vals.tcCurrent}</div>

    </div>

    <div data-review-transport style="position:absolute;left:0;right:0;bottom:0;z-index:50;padding:24px 26px 26px;background:linear-gradient(0deg,rgba(13,14,24,0.95),rgba(13,14,24,0.6) 55%,transparent);">
      <div id="reviewTimelineWrap" style="position:relative;">
        <div style="position:relative;height:26px;">
          ${vals.markers.map((m) => `
            <div data-act="jumpTo" data-arg="${m.ms}" title="${esc(m.tip)}" style="position:absolute;bottom:0;left:${m.leftPct}%;transform:translateX(-50%);cursor:pointer;padding:6px;">

        </div>
        <div id="reviewTimelineBar" data-act="seekFromEvent" style="position:relative;height:3px;background:rgba(233,233,237,0.14);border-radius:2px;cursor:pointer;">
          <div id="reviewBufferedPct" style="position:absolute;left:0;top:0;bottom:0;width:${vals.bufferedPct}%;background:rgba(233,233,237,0.1);border-radius:2px;pointer-events:none;"></div>
          <div id="reviewPlayPct" style="position:absolute;left:0;top:0;bottom:0;width:${vals.playPct}%;background:var(--co-accent);border-radius:2px;pointer-events:none;"></div>
          <div id="reviewNeedle" style="position:absolute;left:${vals.playPct}%;top:-3px;width:9px;height:9px;border-radius:50%;background:#fff;transform:translateX(-50%);pointer-events:none;"></div>
          <div id="reviewHoverLine" style="position:absolute;top:-4px;bottom:-4px;width:1.5px;background:rgba(255,255,255,0.5);display:none;pointer-events:none;"></div>
        </div>
        <div id="reviewHoverTc" style="position:absolute;bottom:20px;transform:translateX(-50%);display:none;pointer-events:none;color:#fff;font-size:11.5px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap;z-index:6;"></div>

        <div style="font-variant-numeric:tabular-nums;font-size:13px;color:var(--co-text-2);white-space:nowrap;"><span id="reviewTcCurrentInline">${vals.tcCurrent}</span> <span style="color:var(--co-faint);">/ <span id="reviewTcDuration">${vals.tcDuration}</span></span></div>

        <div data-act="cycleSafe" data-hide-sm title="Khung an toàn" class="co-act" style="font-size:13px;color:${state.safeAspect === "off" ? "var(--co-muted)" : "var(--co-accent)"};cursor:pointer;white-space:nowrap;">${esc(vals.safeLabel)}</div>

        <div data-act="toggleFullscreen" data-hide-sm title="Toàn màn hình" class="co-act" style="font-size:13px;color:var(--co-muted);cursor:pointer;white-space:nowrap;">Toàn màn hình</div>

    ${state.drawOpen ? drawToolbar() : ""}

}

function qualityMenu(vals) {
  return `
    <div data-act="closeQualityMenu" style="position:fixed;inset:0;z-index:49;"></div>
    <div data-stop="1" style="position:absolute;right:0;bottom:calc(100% + 12px);width:260px;background:var(--co-glass);backdrop-filter:blur(14px);border-radius:12px;padding:8px;z-index:50;animation:coFade 140ms ease;">
      ${vals.qualities.map((q) => `
        <div data-act="setQuality" data-arg="${q.id}" style="display:flex;align-items:baseline;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;">
          <div style="flex:1;min-width:0;font-size:13.5px;font-weight:500;color:${q.isActive ? "var(--co-accent)" : "var(--co-text)"};">${esc(q.label)}</div>
          <div style="font-size:12.5px;color:${q.tagColor};white-space:nowrap;">${esc(q.tag)}</div>
        </div>
      `).join("")}
      <div data-act="openTranscode" class="co-act" style="margin-top:4px;padding:9px 10px 4px;font-size:12.5px;color:var(--co-accent-text);cursor:pointer;">Quản lý proxy…</div>
    </div>`;
}

function commandPalette(vals) {
  const q = (state.paletteQuery || "").trim().toLowerCase();
  const results = paletteResults(q).slice(0, 6);
  return `
  <div data-act="closePalette" data-overlay style="position:fixed;inset:0;background:var(--co-scrim);backdrop-filter:blur(6px);z-index:90;display:flex;justify-content:center;padding:140px 24px;">
    <div data-stop="1" style="width:100%;max-width:560px;">
      <input id="paletteInput" value="${esc(state.paletteQuery)}" placeholder="Tìm dự án, nguồn, ghi chú…" autofocus style="width:100%;background:transparent;border:none;border-bottom:1px solid var(--co-border-2);color:var(--co-text);font-size:24px;font-weight:500;letter-spacing:-0.02em;padding-bottom:16px;" />
      <div style="margin-top:10px;max-height:46vh;overflow-y:auto;">
        ${results.length === 0 ? `<div style="padding:13px 0;font-size:13px;color:var(--co-faint);">Không tìm thấy gì khớp.</div>` : results.map((r) => `
          <div data-act="${r.act}" data-arg="${esc(r.arg)}" class="co-row" style="display:flex;align-items:center;gap:16px;padding:13px 0;border-bottom:1px solid var(--co-hairline);">
            <div style="width:64px;flex:0 0 64px;font-size:12px;color:var(--co-faint);">${esc(r.kind)}</div>
            <div class="co-row-title" style="flex:1;min-width:0;font-size:15px;font-weight:500;color:var(--co-text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(r.label)}</div>
            <div style="font-size:12.5px;color:var(--co-faint);white-space:nowrap;">${esc(r.meta)}</div>
          </div>
        `).join("")}
      </div>
      <div style="margin-top:18px;font-size:12.5px;color:var(--co-faint);">↵ mở · esc đóng</div>
    </div>
  </div>`;
}

function paletteResults(q) {
  const out = [];
  PROJECTS.forEach((p) => out.push({ kind: "Dự án", label: p.name, meta: p.updated || "", act: "openProject", arg: p.id }));
  Object.values(state.sourcesByProject || {}).flat().forEach((srcObj) => {
    out.push({ kind: "Nguồn", label: srcObj.title, meta: fmtDur(srcObj.dur || 0), act: "openSource", arg: srcObj.id });
  });
  (state.comments || []).forEach((c) => {
    out.push({ kind: "Ghi chú", label: c.content, meta: fmtTc(c.ms || 0), act: "jumpTo", arg: String(c.ms || 0) });
  });
  if (!q) return out;
  return out.filter((r) => String(r.label || "").toLowerCase().includes(q));
}

function commentsPanel(vals) {
  const on = reviewChromeVisible();
  const filterLabel = state.filter === "all" ? "tất cả" : (state.filter === "open" ? "đang mở" : "đã xong");
  return `
  <div data-notes-panel data-stop="1" style="position:absolute;right:26px;top:96px;bottom:124px;width:308px;z-index:51;display:flex;flex-direction:column;gap:10px;opacity:${on ? "1" : "0"};pointer-events:${on ? "auto" : "none"};transition:opacity 260ms ease;">
    <div style="display:flex;align-items:baseline;gap:10px;flex:0 0 auto;">
      <div style="font-size:12.5px;color:var(--co-muted);">${vals.countOpen} mở · ${vals.countDone} xong</div>
      <div style="flex:1"></div>
      <div data-act="cycleCommentFilter" class="co-act" style="font-size:12.5px;color:var(--co-faint);cursor:pointer;">${filterLabel}</div>
    </div>

    <div id="notesScroll" style="flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;">
      ${vals.visibleComments.map((c) => `
        <div data-act="jumpTo" data-arg="${c.ms}" style="background:var(--co-glass);backdrop-filter:blur(14px);border-radius:12px;padding:15px 17px;cursor:pointer;opacity:${c.resolved ? "0.45" : "1"};">
          <div style="display:flex;align-items:center;gap:9px;margin-bottom:8px;">
            <div style="width:20px;height:20px;border-radius:50%;background:${c.color};display:grid;place-items:center;font-size:9px;font-weight:600;color:#0d0e18;flex:0 0 20px;">${esc(c.initial)}</div>
            <div style="font-size:12.5px;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(c.name)}</div>
            <div style="font-size:12.5px;color:var(--co-muted);font-variant-numeric:tabular-nums;flex:0 0 auto;">${esc(c.tcLabel)}</div>
            <div style="flex:1"></div>
            <div data-stop="1" data-act="toggleResolve" data-arg="${c.id}" title="Đánh dấu xong" style="font-size:12.5px;color:${c.resolved ? "var(--co-accent)" : "var(--co-muted)"};cursor:pointer;flex:0 0 auto;">✓</div>
          </div>
          ${c.isEditing ? `
            <textarea id="editCommentInput" rows="3" style="width:100%;resize:vertical;background:transparent;border:none;border-bottom:1px solid var(--co-accent-line);color:var(--co-text);font-size:13.5px;line-height:1.55;padding:0 0 6px;">${esc(c.editingText)}</textarea>
            <div style="display:flex;gap:16px;margin-top:9px;">
              ${mBtn("filled", { act: "saveEditComment", arg: c.id, label: "Lưu", sm: true, stop: true })}
              ${mBtn("neutral", { act: "cancelEditComment", label: "Huỷ", sm: true, stop: true })}
            </div>
          ` : `
            <div style="font-size:13.5px;line-height:1.55;color:var(--co-comment);${c.resolved ? "text-decoration:line-through;text-decoration-color:rgba(233,233,237,0.3);" : ""}">${esc(c.content)}</div>
            ${c.hasAnnotation ? `<div style="margin-top:7px;font-size:12px;color:#7d72c4;">có ghi chú vẽ · ${c.annotationStrokeCount} nét${c.annotationTextCount ? " · " + c.annotationTextCount + " text" : ""}</div>` : ""}
            ${c.hasReplies ? `
              <div style="margin-top:9px;display:flex;flex-direction:column;gap:6px;">
                ${c.replies.map((r) => `
                  <div style="font-size:12.5px;line-height:1.5;color:var(--co-text-2);">
                    <span style="color:${r.color};font-weight:500;">${esc(r.name)}</span>
                    <span style="color:var(--co-faint);font-variant-numeric:tabular-nums;"> ${esc(r.tcLabel)}</span>
                    <span> ${esc(r.content)}</span>
                  </div>
                `).join("")}
              </div>
            ` : ""}
            <div style="display:flex;gap:16px;margin-top:9px;">
              <div data-stop="1" data-act="startReply" data-arg="${c.id}" class="co-act" style="font-size:12px;color:${state.replyingTo === c.id ? "var(--co-accent)" : "var(--co-faint)"};cursor:pointer;">${state.replyingTo === c.id ? "Huỷ trả lời" : "Trả lời"}</div>
              <div data-stop="1" data-act="startEditComment" data-arg="${c.id}" class="co-act" style="font-size:12px;color:var(--co-faint);cursor:pointer;">Sửa</div>
              <div data-stop="1" data-act="deleteComment" data-arg="${c.id}" class="co-act" style="font-size:12px;color:var(--co-faint);cursor:pointer;">Xoá</div>

      `).join("")}
      ${vals.emptyState ? `
        <div style="background:var(--co-glass);backdrop-filter:blur(14px);border-radius:12px;padding:15px 17px;font-size:13px;color:var(--co-muted);line-height:1.55;">
          ${state.filter === "all" ? "Chưa có ghi chú nào. Tua tới điểm cần sửa rồi ghi ở dưới." : "Không có ghi chú ở bộ lọc này."}
        </div>
      ` : ""}
    </div>

    <div style="flex:0 0 auto;background:var(--co-glass);backdrop-filter:blur(14px);border-radius:12px;padding:12px 17px;">
      ${state.replyingTo ? `<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12px;color:var(--co-accent-ink);">↳ Trả lời${state.replyingToTcLabel ? " @ " + esc(state.replyingToTcLabel) : ""}<div style="flex:1"></div><span data-act="startReply" data-arg="${esc(state.replyingTo)}" style="cursor:pointer;">✕</span></div>` : ""}
      <div style="display:flex;align-items:center;gap:12px;">
        <div data-act="toggleAttach" id="commentAttachLabel" title="${esc(vals.attachLabel)}" style="font-variant-numeric:tabular-nums;font-size:12px;color:${state.attachTc ? "var(--co-accent)" : "var(--co-faint)"};cursor:pointer;flex:0 0 auto;">${state.attachTc ? esc(vals.tcCurrent) : "no tc"}</div>
        <textarea id="commentInput" rows="1" placeholder="${state.replyingTo ? "Trả lời…" : "Ghi chú tại điểm này…"}"
          oninput="this.style.height='auto';this.style.height=Math.min(96,this.scrollHeight)+'px';"
          style="flex:1;min-width:0;resize:none;background:transparent;border:none;color:var(--co-text);font-size:13.5px;line-height:1.45;min-height:20px;max-height:96px;overflow-y:auto;">${esc(state.newComment)}</textarea>
        <div data-act="postComment" title="Gửi (↵)" style="font-size:12.5px;color:var(--co-accent-text);cursor:pointer;flex:0 0 auto;">↵</div>
      </div>
    </div>
  </div>`;
}

// Fields tab — asset metadata + version status + actions. Layout follows
// Synoframe.dc.html lines 566-589.

function overlayShell(closeAct, maxWidth, padding, inner) {
  return `
  <div data-act="${closeAct}" data-overlay style="position:fixed;inset:0;background:var(--co-scrim);backdrop-filter:blur(6px);z-index:90;display:flex;justify-content:center;padding:${padding};overflow-y:auto;">
    <div data-stop="1" style="width:100%;max-width:${maxWidth};max-height:100%;height:max-content;display:flex;flex-direction:column;">${inner}</div>
  </div>`;
}

function overlayTitle(title, sub) {
  return `<div style="font-size:22px;font-weight:600;letter-spacing:-0.02em;">${esc(title)}</div>
    <div style="font-size:13px;color:var(--co-muted);margin:6px 0 26px;line-height:1.55;">${esc(sub)}</div>`;
}

function transcodeModal(vals) {
  const rt = vals.transcodeRuntime;
  const workerDown = rt && rt.status !== "ready" && rt.status !== "memory";
  return overlayShell("closeTranscode", "660px", "96px 24px", `
    ${overlayTitle("Proxy · " + vals.selTitle, "Bản gốc nằm trên NAS. Tạo proxy nhẹ hơn để review mượt trên đường truyền chậm.")}
    ${workerDown ? `<div style="font-size:13px;color:var(--co-bad);line-height:1.55;margin-bottom:22px;">${esc(vals.transcodeRuntimeMessage || "Worker chưa sẵn sàng để transcode.")}${vals.transcodeRuntimeHelpText ? `<div style="color:var(--co-muted);margin-top:4px;">${esc(vals.transcodeRuntimeHelpText)}</div>` : ""}</div>` : ""}
    <div style="flex:1;min-height:0;overflow-y:auto;">
      ${vals.ladder.map((l) => `
        <div style="display:flex;align-items:center;gap:20px;padding:16px 0;border-bottom:1px solid var(--co-hairline);">
          <div style="width:56px;flex:0 0 56px;font-size:13px;color:var(--co-faint);font-variant-numeric:tabular-nums;">${esc(l.badge)}</div>
          <div style="flex:1;min-width:0;">
            <div style="font-size:15px;font-weight:500;color:var(--co-text);">${esc(l.label)} <span style="color:var(--co-faint);font-weight:400;font-size:13px;">${esc(l.res)}</span></div>
            <div style="margin-top:2px;font-size:12.5px;color:var(--co-faint);line-height:1.5;">${esc(l.detail)}</div>
            ${l.isProcessing ? `<div style="height:2px;border-radius:2px;background:var(--co-border);margin-top:9px;overflow:hidden;"><div style="width:${l.progress}%;height:100%;background:var(--co-warn);"></div></div>` : ""}
          </div>
          <div style="font-size:13px;color:${l.tagColor};white-space:nowrap;">${esc(l.tag)}</div>
          ${l.canRequest || l.pendingRequest ? mBtn("outlined", { act: "requestTranscode", arg: l.id, label: l.pendingRequest ? "Đang gửi…" : "Tạo proxy", sm: true, disabled: l.pendingRequest }) : `<div style="width:62px;flex:0 0 62px;"></div>`}
        </div>
      `).join("")}
    </div>
    <div style="display:flex;align-items:center;gap:20px;padding-top:22px;flex:0 0 auto;">
      <div style="flex:1;font-size:12.5px;color:var(--co-faint);line-height:1.55;">HLS segment 4s · h.264 · AAC. Proxy nằm trên SSD cache, không đọc lại NAS mỗi lần phát.</div>
      ${mBtn("neutral", { act: "closeTranscode", label: "Xong", sm: true })}
    </div>`);
}

function createProjectModal() {
  const s = state;
  const name = s.createProjectName || "";
  const client = s.createProjectClient || "";
  const thumb = s.createProjectThumbDataUrl || "";
  // Only the project name is required; client + thumbnail are optional.
  const canSubmit = !!name.trim() && !s.createProjectBusy;
  const field = (label, value, key, ph) => `
    <div style="display:flex;align-items:baseline;gap:24px;padding:16px 0;border-bottom:1px solid var(--co-hairline);">
      <div style="width:140px;flex:0 0 140px;font-size:14px;color:var(--co-dim);">${esc(label)}</div>
      <input ${key === "name" ? 'id="createProjectNameInput" autofocus' : ""} type="text" value="${esc(value)}" placeholder="${esc(ph)}"
