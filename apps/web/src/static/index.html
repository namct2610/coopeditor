<!doctype html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Coopeditor</title>
<link rel="icon" type="image/png" sizes="32x32" href="brand/favicon-32.png" />
<link rel="icon" type="image/png" sizes="256x256" href="brand/favicon-256.png" />
<link rel="apple-touch-icon" sizes="180x180" href="brand/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
<link rel="stylesheet" href="app/app.css" />
<!-- hls.js: Chrome/Firefox/Edge không phát HLS .m3u8 native (Safari thì có).
     Thư viện này gắn vào <video> qua MSE để phát proxy. Đóng kèm trong gói
     để NAS chỉ có mạng LAN vẫn phát được. -->
<script src="vendor/hls.min.js" defer></script>
<script>
  // Apply the last theme/accent before first paint so there's no dark→light
  // flash; the account's saved prefs take over once /me loads.
  (function () {
    try {
      var t = localStorage.getItem("co-theme") || "dark";
      if (t === "system") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", t === "light" ? "light" : "dark");
      var h = localStorage.getItem("co-hue");
      if (h) document.documentElement.style.setProperty("--h", h);
    } catch (_) {}
  })();
</script>
</head>
<body>
<div id="app">
  <!-- Shown until the app module mounts, so a slow API start (cold NAS) never
       looks like a blank page. -->
  <div class="boot">
    <div class="boot-mark"><img src="brand/logo.png" alt="" /></div>
    <div class="boot-name"><span class="acc">Coop</span>editor</div>
    <div class="boot-hint" id="bootHint">Đang khởi động…</div>
  </div>
</div>
<script type="module" src="app/main.mjs"></script>
</body>
</html>
